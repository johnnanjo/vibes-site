<style>
/* VIBES KIDS brain games: three small games on one felt table. Same paper, navy and mustard as the KIDS page; ball colours are the real ones. */
:root{--paper:#FFF8EA;--cream:#F4EAD5;--navy:#1F2C38;--soft:#5A5148;--mustard:#F2B43A;--felt:#2F9E6B;--felt2:#1F7A50;--rail:#8A5A2B;--tomato:#D63B2A;--teal:#2F7D84;
--pop:"RocknRoll One","Hiragino Maru Gothic ProN",sans-serif;--body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",sans-serif;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--cream);color:var(--navy);font-family:var(--body);-webkit-user-select:none;user-select:none;touch-action:manipulation}
[hidden]{display:none!important}
.app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:12px;padding:calc(12px + env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.top{display:flex;align-items:center;gap:10px}
.back{flex:none;font:700 14px var(--body);color:var(--navy);text-decoration:none;background:var(--paper);border:2px solid var(--navy);border-radius:999px;padding:8px 14px}
h1{margin:0;font:400 22px/1.25 var(--pop);flex:1;min-width:0}
.lv{display:flex;gap:8px}
.lv button{flex:1;font:400 15px var(--pop);color:var(--navy);background:var(--paper);border:2px solid var(--navy);border-radius:14px;padding:10px 4px;cursor:pointer}
.lv button[aria-pressed="true"]{background:var(--navy);color:var(--paper)}
.lv button small{display:block;font:700 11px var(--body);opacity:.85;margin-top:2px}
.hud{display:flex;gap:8px}
.hud div{flex:1;background:var(--paper);border-radius:14px;padding:8px 6px;text-align:center;font:700 12px var(--body);color:var(--soft)}
.hud b{display:block;font:400 22px/1.15 var(--pop);color:var(--navy);font-variant-numeric:tabular-nums}
.msg{min-height:52px;display:flex;align-items:center;justify-content:center;text-align:center;font:400 17px/1.5 var(--pop);background:var(--mustard);border-radius:14px;padding:8px 12px}
.stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
button{font:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
/* balls */
.ball{position:relative;display:block;border-radius:50%;aspect-ratio:1;background:var(--c);box-shadow:inset -8% -10% 0 rgba(0,0,0,.18),0 2px 4px rgba(0,0,0,.3);overflow:hidden}
.ball.st{background:#FBFBF6}
.ball.st::before{content:"";position:absolute;left:0;right:0;top:24%;bottom:24%;background:var(--c)}
.ball i{position:absolute;left:50%;top:50%;width:46%;height:46%;transform:translate(-50%,-50%);border-radius:50%;background:#FBFBF6;display:flex;align-items:center;justify-content:center;font:400 normal 100%/1 var(--pop);color:#1F2C38;font-size:var(--fs,16px)}
.ball.cue{background:#FBFBF6}
/* 1: memory */
.mem{width:100%;display:grid;gap:8px}
.card{position:relative;aspect-ratio:3/4;border:0;padding:0;background:none;cursor:pointer;perspective:600px}
.card>span{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .32s;display:flex;align-items:center;justify-content:center}
.card .bk{background:var(--navy);border:3px solid var(--paper);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.card .bk::after{content:"";width:46%;aspect-ratio:1;border-radius:50%;border:4px solid var(--mustard)}
.card .ft{background:var(--paper);border:3px solid var(--navy);transform:rotateY(180deg);padding:14%}
.card .ft .ball{width:100%}
.card.on>.bk{transform:rotateY(180deg)}.card.on>.ft{transform:rotateY(360deg)}
.card.ok .ft{border-color:var(--felt);background:#E3F3E6}
/* 2: which pocket */
.tbl{height:100%;max-height:62vh;aspect-ratio:100/170;max-width:100%}
.tbl svg{width:100%;height:100%;display:block;overflow:visible}
.pk{cursor:pointer;outline:none}.pk:focus-visible circle.h{stroke:var(--mustard);stroke-width:2.4}
.pk circle.h{fill:#12161C;stroke:var(--paper);stroke-width:1.2}
.pk text{font:400 6px var(--pop);fill:var(--paper);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pk.pick circle.h{stroke:var(--mustard);stroke-width:2.4}
.pk.good circle.h{fill:var(--felt);stroke:var(--paper);stroke-width:2.4}
.pk.bad circle.h{fill:var(--tomato)}
/* 3: order tap */
.felt{position:relative;width:100%;max-width:min(100%,46vh);aspect-ratio:3/4;background:radial-gradient(circle at 50% 40%,var(--felt),var(--felt2));border:10px solid var(--rail);border-radius:18px;box-shadow:inset 0 0 0 3px rgba(0,0,0,.25);overflow:hidden;touch-action:none}
.felt .b{position:absolute;width:17%;border:0;padding:0;background:none;cursor:pointer;transform:translate(-50%,-50%);transition:opacity .25s,scale .25s}
.felt .b .ball{width:100%}
.felt .b.out{opacity:0;scale:.2;pointer-events:none}
.felt .b.ng{animation:ng .3s}
@keyframes ng{25%{translate:-6px 0}75%{translate:6px 0}}
/* result */
.res{position:fixed;inset:0;z-index:5;background:rgba(31,44,56,.86);display:flex;align-items:center;justify-content:center;padding:18px}
.res>div{width:100%;max-width:420px;background:var(--paper);border-radius:22px;padding:22px 18px;text-align:center;display:flex;flex-direction:column;gap:12px}
.res h2{margin:0;font:400 26px/1.3 var(--pop)}
.stars{font-size:44px;line-height:1;letter-spacing:6px;color:#D8D2C2}
.stars b{color:var(--mustard);font-weight:400}
.res p{margin:0;font:700 15px/1.7 var(--body)}
.res .tip{background:var(--cream);border-radius:14px;padding:10px 12px;font:700 14px/1.7 var(--body);text-align:left}
.btn{display:block;width:100%;font:400 18px var(--pop);border:2px solid var(--navy);border-radius:999px;padding:13px 10px;cursor:pointer;text-decoration:none;color:var(--navy);background:var(--paper)}
.btn.go{background:var(--mustard)}
.btn.real{background:var(--felt);color:#fff;border-color:var(--felt2)}
.how{font:700 13px/1.7 var(--body);color:var(--soft);text-align:center}
@media (prefers-reduced-motion:reduce){.card span{transition:none}.felt .b{transition:none}}
</style>
