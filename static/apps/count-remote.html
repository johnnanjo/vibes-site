<!doctype html>
<html lang="ja" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>スリークッション デジタルカウント リモコン（タブレット・スマホ）｜VIBES BILLIARDS</title>
<meta name="description" content="タブレットやスマホから、モニターのスリークッション デジタルカウントを操作するリモコン。">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://vibesbilliards.com/pages/count-remote">
<link rel="icon" href="/img/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+JP:wght@500;700;900&display=swap">
<style>
:root{--night:#171A22;--night2:#262A35;--line:#3A3F4C;--lime:#C0FC09;--chalk:#F3F4EF;--sub:#A3A8B5;--felt:#1E5AA8;--yellow:#F2C200;--red:#D7262E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--night);color:var(--chalk);font-family:"Noto Sans JP",system-ui,sans-serif;touch-action:manipulation}
[hidden]{display:none!important}
.num{font-family:Anton,Impact,"Arial Narrow",sans-serif;font-variant-numeric:tabular-nums;line-height:1}
.wrap{max-width:820px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;min-height:100vh}
.top{display:flex;align-items:center;gap:10px}
.top img{height:34px;width:auto}
.st{margin-left:auto;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--sub)}
.st i{width:12px;height:12px;border-radius:50%;background:var(--red)}
.st.ok i{background:var(--lime)}
button{font:inherit;color:inherit;cursor:pointer;border:0}
.sm{background:var(--night2);border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-weight:700;font-size:14px}
.card{background:var(--night2);border-radius:18px;padding:16px}
h1{font-size:22px;margin:0 0 6px}
p{margin:0 0 12px;color:var(--sub);font-size:15px;line-height:1.7}
label{display:block;font-weight:700;font-size:14px;margin:0 0 6px}
input{width:100%;min-width:0;font:inherit;font-size:20px;font-weight:700;color:var(--chalk);background:var(--night);border:2px solid var(--line);border-radius:12px;padding:12px}
input:focus{outline:none;border-color:var(--lime)}
.code{font-family:Anton,Impact,sans-serif;font-size:44px;letter-spacing:.14em;text-align:center}
.go{background:var(--lime);color:var(--night);font-weight:900;font-size:20px;border-radius:14px;padding:16px;width:100%}
.err{color:#FF8A8F;font-weight:700;font-size:14px;min-height:20px;margin:8px 0 0}
.pl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.p{background:var(--felt);border-radius:16px;padding:12px;border:4px solid transparent;min-width:0;display:flex;flex-direction:column;gap:8px;position:relative}
.p.on{border-color:var(--lime)}
.p .at{display:none;font-style:normal;align-self:flex-start;background:var(--lime);color:var(--night);font-weight:900;font-size:11px;letter-spacing:.08em;padding:1px 10px;border-radius:99px}
.p.on .at{display:block}.p:not(.on) .at{display:block;visibility:hidden}
.p .tap{display:block;width:100%;background:rgba(10,16,30,.45);border:2px solid rgba(255,255,255,.28);border-radius:14px;padding:10px 4px 8px;color:inherit;font:inherit;cursor:pointer;touch-action:manipulation}
.p .tap:active{background:rgba(255,255,255,.22);transform:scale(.98)}
.p .tap small{color:#fff;font-size:12px;letter-spacing:.06em}
.p:not(.on) .tap .sc{opacity:1}
.p .chg{width:100%;min-height:58px;border-radius:14px;border:0;background:var(--chalk);color:var(--night);font:inherit;font-weight:900;font-size:16px;letter-spacing:.02em;cursor:pointer;touch-action:manipulation}
.p .chg:active{background:#D9DBD3;transform:scale(.98)}
.p .tap:focus-visible,.p .chg:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.p .nm{display:flex;align-items:center;gap:8px;font-weight:900;font-size:16px;min-width:0}
.p .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p .nm i{width:16px;height:16px;border-radius:50%;flex:none}
.p .sc{display:block;font-size:72px;text-align:center;line-height:1.05}
.p0 .sc{color:#fff}.p1 .sc{color:var(--yellow)}
.p small{display:block;text-align:center;font-weight:700;font-size:12px;color:#DCE3F0}
.rdy{display:grid;gap:10px}.rdy>small{font-weight:900;color:var(--sub);letter-spacing:.06em;font-size:13px}
.ord{display:grid;gap:8px}.ord div{display:flex;align-items:center;gap:10px;background:var(--felt);border-radius:14px;padding:12px}
.ord i{font-style:normal;flex:none;background:var(--lime);color:var(--night);font-weight:900;font-size:12px;padding:2px 10px;border-radius:99px}
.ord div+div i{background:rgba(10,16,30,.5);color:#fff}
.ord b{font-size:20px;font-weight:900;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
[hidden]{display:none!important}
.mg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mg.c1{grid-template-columns:minmax(0,1fr)}.mg.c1 .mt{min-height:120px}.mg.c1 .mt b{font-size:26px}
.mhead{display:flex;align-items:center;gap:10px;min-height:40px;margin-bottom:8px}.mhead b{font-size:20px;font-weight:900}
.mt.lt{color:var(--night)}.mt.lt small,.mt.lt em{color:#3A3F4C}
.mt em{font-style:normal;font-size:11px;font-weight:700;color:#DCE3F0}
.mt{border:0;border-radius:16px;padding:14px 8px;min-height:104px;color:#fff;font:inherit;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:4px;cursor:pointer;touch-action:manipulation;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.mt.carom{background:linear-gradient(180deg,#2468C0,#1E5AA8 46%,#164482)}.mt.pocket{background:linear-gradient(180deg,#6E7683,#5A616C 46%,#434953)}
.mt:active{transform:scale(.97)}.mt small{font-size:10px;font-weight:700;letter-spacing:.14em;color:#DCE3F0}.mt b{font-size:17px;font-weight:900;line-height:1.25}
.mg.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.mg.c2 .mt b{font-size:20px}
.mlogo span{margin-top:10px;padding-top:9px;border-top:3px solid var(--lime);font-family:Unbounded,Anton,sans-serif;font-weight:900;font-size:15px;letter-spacing:.34em;text-indent:.34em;color:var(--chalk)}
.mlogo{display:grid;place-items:center;padding:26px 0}.mlogo img{height:96px;width:auto}
.pkh{display:grid;gap:10px}.pkh>small{font-weight:900;letter-spacing:.06em;color:var(--sub)}
.pkp{display:grid;gap:8px}.pp{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#5A616C;border-radius:14px;padding:10px 14px;border:3px solid transparent}
.pp.on{border-color:var(--lime)}.pp span{font-weight:900;font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pp b{font-size:34px;line-height:1}
.pkm{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700;color:var(--sub);font-size:13px}.pkm b{font-size:30px;color:var(--chalk)}
.k.hl{background:var(--lime);color:var(--night);border-color:var(--lime)}.k.hl small{color:#3A3F4C}
.run{display:flex;align-items:center;justify-content:space-between;gap:10px}
.run b{font-size:54px}
.run small{font-weight:700;color:var(--sub);font-size:13px}
.pad{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{border-radius:18px;font-weight:900;font-size:22px;padding:18px 8px;background:var(--night2);border:2px solid var(--line);min-height:76px}
.k:active{transform:scale(.97);background:#313644}
.k.big{grid-column:1/-1;font-size:40px;min-height:130px;background:var(--lime);color:var(--night);border-color:var(--lime)}
.k.big:active{background:#A8DC08}
.k.end{grid-column:1/-1;font-size:28px;min-height:96px;background:var(--chalk);color:var(--night);border-color:var(--chalk)}
.k.on{border-color:var(--lime)}
.k small{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-top:2px}
.k.big small,.k.end small{color:#3A3F4C}
.note{font-size:13px;color:var(--sub);text-align:center;margin:0}
.row2{display:grid;grid-template-columns:1fr 110px;gap:10px;margin-bottom:10px}.row2.one{grid-template-columns:1fr}
.cfr{margin-bottom:12px}.cfr label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}.cfr input,.cfr select{width:100%;font:inherit;font-size:18px;font-weight:700;color:var(--chalk);background:var(--night);border:2px solid var(--line);border-radius:12px;padding:12px}
.rl{display:grid;gap:8px;max-height:52vh;overflow:auto}.rr{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;background:var(--night);border:2px solid var(--line);border-radius:14px;padding:12px 14px;min-height:60px;width:100%}.rr span{min-width:0;display:grid}.rr b{font-size:19px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rr small{font-size:12px;color:var(--sub);font-weight:700}.rr i{font-style:normal;font-weight:900;font-size:22px;background:var(--night2);border-radius:10px;padding:4px 10px}.rr:active{border-color:var(--lime)}
.ph .sm.pick{margin-left:auto;border-color:var(--lime)}.ph .sm.pick+.sm{margin-left:0}
.pre{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pre .sm{min-height:46px;font-size:15px}
.rt{display:grid;gap:10px}.rc{background:var(--night);border:2px solid var(--line);border-radius:14px;padding:12px}.rc>b{display:block;font-size:19px;font-weight:900;margin-bottom:8px}.rc>div{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px}.rc span{display:grid;gap:2px;text-align:center}.rc small{font-size:11px;font-weight:700;color:var(--sub)}.rc i{font-style:normal;font-weight:900;font-size:22px}
.run3{display:flex;gap:8px;text-align:center}.run3>div{flex:1 1 0;min-width:0}.run3>div{display:grid;gap:2px}.run3 small{font-weight:700;color:var(--sub);font-size:13px}.run3 b{font-size:64px;line-height:1}
.tmv{color:var(--sub)}.tmv.tick{color:var(--chalk)}.tmv.low{color:#FF5A5F}
.pkm b{font-size:54px!important;line-height:1}.pkm .tmc{display:grid;text-align:center;gap:2px}.pkm .tmc small{font-size:12px}
@media (min-width:700px){
.wrap{max-width:1100px;padding-left:22px;padding-right:22px;gap:16px}
.p{padding:18px;gap:12px}.p .nm{font-size:26px}.p .sc{font-size:min(150px,22vh)}.p .tap small{font-size:16px}.p .chg{min-height:84px;font-size:26px}.p>small{font-size:17px}
.run3 b{font-size:min(110px,14vh)}.run3 small{font-size:18px}
.pad{gap:14px}.k{font-size:30px;min-height:104px}.k small{font-size:16px}.k.big{font-size:52px;min-height:160px}
.pp span{font-size:26px}.pp b{font-size:56px}.pkm{font-size:18px}.pkm b{font-size:84px!important}
.ord b{font-size:28px}.pre .sm{min-height:60px;font-size:20px}
.mt{min-height:170px}.mt b{font-size:28px}.mg.c1 .mt b{font-size:38px}.mlogo img{height:130px}
.card{padding:26px}.card p{font-size:18px}label,.cfr label{font-size:17px}input,.cfr input,.cfr select{font-size:24px;padding:14px}.go{font-size:26px;padding:20px}.sm{font-size:17px;min-height:48px;padding:8px 16px}.npick .sm{font-size:20px;min-height:58px}.ph{font-size:22px}.row2{grid-template-columns:1fr 160px}.sv button{font-size:18px;padding:10px 16px}.note{font-size:16px}
.mt small{font-size:13px}.mt em{font-size:16px}.mhead b{font-size:26px}.over{font-size:26px;padding:16px}.rdy>small{font-size:17px}.ord i{font-size:15px}.ord div{padding:16px}.rc small{font-size:14px}.k.hl small{color:#3A3F4C}
.card h1{font-size:28px}.rr b{font-size:24px}.rr{min-height:72px}.rc>b{font-size:26px}.rc i{font-size:32px}.rc small{font-size:14px}
}
@media (min-width:1000px) and (orientation:landscape){
#vMain:not([hidden]){display:grid!important;grid-template-columns:1.35fr 1fr;align-items:start;gap:16px}
#vMain #over,#vMain #rdy,#vMain #foot{grid-column:1/-1}#vMain #plBox{grid-column:1;grid-row:span 2}#vMain #runBox,#vMain #mainPad{grid-column:2}
#vMain .p .sc{font-size:min(190px,30vh)}#vMain .p .chg{min-height:110px;font-size:30px}
#vPk:not([hidden]){display:grid!important;grid-template-columns:1fr 1fr;align-items:start;gap:16px}#vPk #pkOver,#vPk #pkRdy{grid-column:1/-1}#vPk #pkHead{grid-column:1;grid-row:span 2}
}
.npick{display:flex;gap:8px;margin:0 0 14px}.npick .sm{flex:1;min-height:46px;font-size:16px}.npick .sm.on{background:var(--lime);color:var(--night);border-color:var(--lime)}
.ph .sm{margin-left:auto}
.sv{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.sv button{background:var(--night);border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-weight:700;font-size:14px}
.ph{display:flex;align-items:center;gap:8px;font-weight:900;font-size:17px;margin:0 0 10px}
.ph i{width:16px;height:16px;border-radius:50%}
.ph button{margin-left:auto}
.over{background:var(--chalk);color:var(--night);border-radius:14px;padding:12px;text-align:center;font-weight:900;font-size:18px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a href="/" aria-label="VIBES BILLIARDS home"><img src="/img/vibes-logo-t.png" alt="VIBES BILLIARDS"></a>
    <span class="st" id="st"><i></i><span id="stT">つながっていません</span></span>
    <button type="button" class="sm" id="bCode" hidden>台を変える</button>
  </div>

  <section class="card" id="vJoin">
    <h1>リモコン</h1>
    <p>モニターに出ている6けたの番号を入れてください。（モニター側で「リモコン」を押すと番号が出ます）</p>
    <form id="fJoin">
      <label for="iCode">番号</label>
      <input id="iCode" class="code" inputmode="numeric" autocomplete="off" maxlength="7" placeholder="000 000">
      <p class="err" id="eJoin"></p>
      <button class="go" type="submit">つなぐ</button>
    </form>
  </section>

  <section id="vMenu" hidden>
    <div class="mhead"><button type="button" class="sm" id="mBack" hidden>← もどる</button><b id="mTitle"></b></div>
    <div class="mg" id="mgTop"></div>
    <div class="mlogo"><img src="/img/vibes-logo-t.png" alt="VIBES BILLIARDS"><span>DIGITAL LAB</span></div>
    <div class="mg" id="mgBot"></div>
    <p class="note" style="text-align:center">種目を押すと、モニターが切り替わります。</p>
  </section>

  <section id="vPk" hidden style="display:none;flex-direction:column;gap:12px">
    <div class="over" id="pkOver" hidden></div>
    <div class="card rdy" id="pkRdy" hidden>
      <small>順番を決めます。先攻が上です。</small>
      <div class="ord" id="pkRdyO"></div>
      <button type="button" class="k" data-c="swap" id="pkSwap">入れ替え<small>順番を入れ替える</small></button>
      <button type="button" class="k big" data-c="start">試合開始<small>始める時に押す</small></button>
      <div class="pre"><button type="button" class="sm prePl">選手を変える</button><button type="button" class="sm cfb">設定</button><button type="button" class="sm" data-c="warmup">練習時間</button><button type="button" class="sm" data-c="home">メニュー</button></div>
    </div>
    <div class="card pkh" id="pkHead"><small id="pkTitle"></small><div class="pkp" id="pkP"></div><div class="pkm"><span id="pkMidL"></span><b class="num" id="pkMid"></b><span id="pkInfo"></span><span class="tmc"><small>残り秒</small><b class="num tmv" id="pkTm"></b></span></div></div>
    <div class="pad" id="pkKeys"></div>
    <div class="pad" id="pkPad">
      <button type="button" class="k" data-c="clock">秒数カウント<small id="pkClockS"></small></button>
      <button type="button" class="k pzb" data-c="pause">一時停止<small>時計を止める</small></button>
      <button type="button" class="k endb" style="grid-column:1/-1">試合終了<small>2回押す</small></button>
    </div>
  </section>

  <section id="vMain" hidden style="display:flex;flex-direction:column;gap:12px">
    <div class="over" id="over" hidden></div>
    <div class="card rdy" id="rdy" hidden>
      <small>バンキングで先攻・後攻を決めます。先攻が左です。</small>
      <div class="ord" id="rdyO"></div>
      <button type="button" class="k" data-c="swap" id="rdySwap">入れ替え<small>先攻・後攻を入れ替える</small></button>
      <button type="button" class="k big" data-c="start">試合開始<small>先攻が初球を撞く時に押す</small></button>
      <div class="pre"><button type="button" class="sm prePl">選手を変える</button><button type="button" class="sm cfb">設定</button><button type="button" class="sm" data-c="warmup">練習時間</button><button type="button" class="sm" data-c="home">メニュー</button></div>
    </div>
    <div class="pl" id="plBox">
      <div class="p p0" id="p0"><div class="nm"><i style="background:#fff"></i><span id="n0"></span></div><em class="at">撞く番</em><button type="button" class="tap" data-c="add" aria-label="Add one point"><span class="sc num" id="s0">0</span><small>押すと1点</small></button><small id="d0"></small><button type="button" class="chg" data-c="commit">交代</button></div>
      <div class="p p1" id="p1"><div class="nm"><i style="background:#F2C200"></i><span id="n1"></span></div><em class="at">撞く番</em><button type="button" class="tap" data-c="add" aria-label="Add one point"><span class="sc num" id="s1">0</span><small>押すと1点</small></button><small id="d1"></small><button type="button" class="chg" data-c="commit">交代</button></div>
    </div>
    <div class="card run3" id="runBox"><div><small>イニング</small><b class="num" id="inn">1</b></div><div><small>この回の点</small><b class="num" id="run">0</b></div><div class="tmc"><small>残り秒</small><b class="num tmv" id="tm"></b></div></div>
    <div class="pad" id="mainPad">
      <button type="button" class="k" data-c="sub">−1<small>1点へらす</small></button>
      <button type="button" class="k" data-c="undo">戻る<small>ひとつ前にもどす</small></button>
      <button type="button" class="k" data-c="clock" id="kClock">秒数カウント<small id="kClockS"></small></button>
      <button type="button" class="k pzb" data-c="pause">一時停止<small>時計を止める</small></button>
      <button type="button" class="k endb" style="grid-column:1/-1">試合終了<small>2回押す</small></button>
    </div>
    <p class="note" id="foot"></p>
  </section>

  <section class="card" id="vRes" hidden>
    <h1>試合終了</h1>
    <div class="over" id="resW"></div>
    <p class="note" id="resT" style="margin:10px 0"></p>
    <div class="rt" id="resB"></div>
    <button type="button" class="go" data-c="newgame" style="margin-top:14px">新しい試合（同じ選手）</button>
    <div class="pad" style="margin-top:10px">
      <button type="button" class="k prePl" style="font-size:18px">選手を変える</button>
      <button type="button" class="k" data-c="home" style="font-size:18px">トップへ戻る</button>
      <button type="button" class="k" data-c="undo" style="grid-column:1/-1;font-size:16px;min-height:56px">戻る<small>まちがえて終了した時</small></button>
    </div>
  </section>

  <section class="card" id="vRo" hidden>
    <h1>選手名簿</h1>
    <p id="roLead">一度登録した選手は、ずっと残ります。名前を押すと、持ち点などを直せます。</p>
    <button type="button" class="go" id="roNew">＋ 新しい選手を登録</button>
    <label for="roQ" style="margin-top:14px">さがす（名前・よみがな）</label>
    <input id="roQ" autocomplete="off" placeholder="例：やまだ">
    <p class="note" id="roCnt" style="text-align:left;margin:8px 0"></p>
    <div class="rl" id="roList"></div>
    <button type="button" class="k" id="roBack" style="width:100%;min-height:56px;font-size:18px;margin-top:10px">戻る</button>
  </section>

  <section class="card" id="vEd" hidden>
    <h1 id="edH">選手の登録</h1>
    <form id="fEd">
      <div class="cfr"><label for="edN">名前（漢字でも入れられます）</label><input id="edN" maxlength="20" autocomplete="off" placeholder="例：山田 太郎"></div>
