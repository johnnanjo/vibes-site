<body>
<div class="board" id="board">
  <div class="top">

    <span class="ttl" id="ttl">POCKET SCOREBOARD</span>
    <span style="display:flex;gap:.8vw"><button type="button" id="bHome">メニュー</button><button type="button" id="bRm">リモコン</button><button type="button" id="bKey" hidden>キー設定 (K)</button><button type="button" id="bPl">選手</button><button type="button" id="bPr">練習時間 (P)</button><button type="button" id="bSet">設定 (/)</button><button type="button" id="bFull">全画面 (F)</button></span>

  <div>

    <div class="cd" id="tbox" aria-label="Shot clock"><div class="segs" id="segs"></div><b class="num" id="tm">40</b></div>

</div>

<div class="over-l" id="setL" hidden>

      <div class="f"><label for="fnp">人数</label><select id="fnp"></select></div>
      <div class="f"><label for="fto">タイムアウトの回数（0＝なし）</label><input id="fto" type="number" inputmode="numeric" min="0" max="9"></div>
      <div class="f pf0"><label for="fn0">選手1（白）の名前</label><input id="fn0" maxlength="14" autocomplete="off" list="roster"></div>
      <div class="f pf0 pg0"><label for="fg0">選手1のセット数（先取）</label><input id="fg0" type="number" inputmode="numeric" min="1" max="999"></div>
      <div class="f pf1"><label for="fn1">選手2（黄）の名前</label><input id="fn1" maxlength="14" autocomplete="off" list="roster"></div>
      <div class="f pf1 pg1"><label for="fg1">選手2のセット数（先取）</label><input id="fg1" type="number" inputmode="numeric" min="1" max="999"></div>
      <div class="f pf2"><label for="fn2">選手3（赤）の名前</label><input id="fn2" maxlength="14" autocomplete="off" list="roster"></div>
      <div class="f pf2 pg2"><label for="fg2">選手3のセット数（先取）</label><input id="fg2" type="number" inputmode="numeric" min="1" max="999"></div>
      <div class="f pf3"><label for="fn3">選手4（緑）の名前</label><input id="fn3" maxlength="14" autocomplete="off" list="roster"></div>
      <div class="f pf3 pg3"><label for="fg3">選手4のセット数（先取）</label><input id="fg3" type="number" inputmode="numeric" min="1" max="999"></div>
      <div class="f o-g5"><label for="fl">ラック数の上限（0＝なし）</label><input id="fl" type="number" inputmode="numeric" min="0" max="999"></div>
      <div class="f"><label for="ft">残り秒数（0＝使わない）</label><input id="ft" type="number" inputmode="numeric" min="0" max="180"></div>
      <div class="f"><label for="fp">練習時間（分）</label><input id="fp" type="number" inputmode="numeric" min="1" max="60"></div>
      <div class="f" style="display:flex;align-items:flex-end"><button type="button" class="btn" id="bPr2" style="width:100%">練習タイマーを開く</button></div>
      <div class="f o-set"><label for="fe">ブレイク</label><select id="fe"><option value="alt">交互</option><option value="win">勝った人</option></select></div>

  </form>
</div>

<div class="over-l" id="winL" hidden>
  <div class="panel win" role="dialog" aria-label="Game over">
    <h2>試合終了</h2>
    <div class="big" id="wName"></div>
    <table><thead><tr id="wH"></tr></thead><tbody id="wT"></tbody></table>
    <div class="acts"><button type="button" class="btn" id="bBack">戻る (BackSpace)</button><button type="button" class="btn go" id="bAgain">新しい試合 (Enter)</button></div>
  </div>
</div>
<div class="over-l" id="wzL" hidden>
  <div class="panel wz" role="dialog" aria-label="Player entry"><h2 id="wzH"></h2><div id="wzB"></div><div class="keys" id="wzK"></div></div>
</div>
<div class="over-l" id="rmL" hidden>
  <div class="panel wz" role="dialog" aria-label="Remote control">
    <h2>リモコン <small id="rmS"></small></h2>

    <div class="inp" style="justify-content:center"><span class="num" id="rmC" style="font-size:16vh;letter-spacing:.08em"></span></div>
    <div class="acts"><button type="button" class="btn" id="rmOff">リモコンを切る</button><button type="button" class="btn go" id="rmOk">閉じる (Enter)</button></div>
  </div>
</div>
<div class="over-l" id="kmL" hidden>
  <div class="panel wz" role="dialog" aria-label="Key setup"><h2 id="kmH"></h2><div class="inp"><span id="kmT"></span></div><p class="note" id="kmN"></p><div class="keys"><span><kbd>Esc</kbd>やめる</span></div></div>
</div>
<div class="over-l rd" id="rdL" hidden>
  <div class="rdp" role="dialog" aria-label="Ready to start">
    <img id="rdLogo" alt="VIBES BILLIARDS">
    <div class="rdm" id="rdM"></div>
    <p class="rdn" id="rdN"></p>
    <div class="acts" style="justify-content:center"><button type="button" class="btn" id="rdSwap">入れ替え (/)</button><button type="button" class="btn" id="rdWarm">練習時間 (-)</button><button type="button" class="btn go big" id="rdGo">試合開始 (Enter)</button></div>
    <div class="keys"><span><kbd>/</kbd>先攻・後攻を入れ替え</span><span><kbd>-</kbd>練習時間</span><span><kbd>BackSpace</kbd>選手の登録</span><span><kbd>Enter</kbd>試合開始</span></div>
  </div>
</div>
<div class="over-l" id="prL" hidden>
  <div class="panel pt" id="prP" role="dialog" aria-label="Warm-up timer">
    <h2>練習時間 <span id="prWho" style="color:var(--sub);font-size:.7em"></span></h2>
    <div class="clock" id="prC">5:00</div>
    <div class="keys"><span><kbd>+</kbd>開始・停止</span><span><kbd>/</kbd>最初にもどす</span><span><kbd>1-9</kbd>分数を変える</span><span><kbd>Enter</kbd>閉じる</span></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="/js/qr.js"></script>
<script src="/js/names.js"></script>
<script>
(function () {
  var TB = (function () { var m = /[?&]t=(\d)/.exec(location.search); return m ? +m[1] : 0; })();
  var KEY = 'vibes-count-pocket-v1' + (TB ? '-t' + TB : '');
  var $ = function (id) { return document.getElementById(id); };
  var RK = 'vibes-count-pocket-roster-v1', hi = function () { return 0; }, avg = function () { return '0'; };
  var PCOL = ['#FFFFFF', '#F2C200', '#E5484D', '#35C486'], PCN = ['白', '黄', '赤', '緑'];

  var isDefName = function (v) { return /^PLAYER [1-4]$/.test(v || ''); };

    var N = c.n.length, z = function (f) { var a = []; for (var i = 0; i < N; i++) a.push(f()); return a; };

  };
  var NP = function () { return S.cfg.n.length; };
  var fresh = function () { return !S.moves && !S.run && !S.over; };
  function setN(n) { var m = M(); n = Math.max(m.min, Math.min(m.max, n)); var c = S.cfg; while (c.n.length < n) { c.n.push('PLAYER ' + (c.n.length + 1)); c.g.push(c.g[0] || 5); } c.n.length = n; c.g.length = n; var h = hist; S = def(c); hist = h; }
  function setMode(k) { if (!MODES[k]) return; var c = S.cfg; c.mode = k; if (MODES[k].pb) c.pb = MODES[k].pb; var n = c.n.length; if (n < MODES[k].min || n > MODES[k].max) n = MODES[k].n; setN(n); }
  var S = def(), hist = [], tLeft = 0, tOn = false, tId = null, dotAt = 0, actx = null;
  try { var raw = localStorage.getItem(KEY); if (raw) { var o = JSON.parse(raw); if (o && o.cfg && o.sc && MODES[o.cfg.mode]) { var c0 = Object.assign(def().cfg, o.cfg); var d0 = def(c0); S = Object.assign(d0, o); S.cfg = c0; ['sc', 'inn', 'fr', 'cnt', 'to'].forEach(function (k) { if (!S[k] || S[k].length !== c0.n.length) S = def(c0); }); } } } catch (e) {}
  var roster = {};
  function drawRoster() { var dl = $('roster'); dl.textContent = ''; players.forEach(function (o) { var n0 = o.mei ? o.sei + ' ' + o.mei : o.sei; var op = document.createElement('option'); op.value = n0; dl.appendChild(op); }); }
  function remember() {}
  var save = function () { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
  var snap = function () { hist.push(JSON.stringify(S)); if (hist.length > 400) hist.shift(); };

  }
  /* ---- point balls (5-9 / 5-10) ---- */
  function pbMap() { var m = {}; String(S.cfg.pb || '').split(/[,、\s]+/).forEach(function (t) { var a = /^(\d{1,2})\s*[=:＝]\s*(\d{1,2})$/.exec(t); if (a && +a[1] >= 1 && +a[1] <= 15 && +a[2] > 0) m[+a[1]] = +a[2]; }); var L = M().last; if (L && !m[L]) m[L] = 2; return m; }
  var pbKeys = function () { return Object.keys(pbMap()).map(Number).sort(function (a, b) { return a - b; }); };
  /* ---- bowlard (bowling scoring) ---- */
  function bState(r) {

    var a = r[i], b = r[i + 1], c = r[i + 2];
    if (a == null) return { frame: 10, ball: 1, pins: 10, done: false };

  function bFrames(r) {

        else { tot += r[i] + r[i + 1]; out.push({ m: (r[i] || '-') + ' ' + (r[i + 1] || '-'), c: tot }); i += 2; }
      } else {
        var a = r[i], b = r[i + 1], c = r[i + 2], mk = [];
        mk.push(a === 10 ? 'X' : (a || '-'));

  var bCount = function (p, k) { var ch = k === 's' ? 'X' : '/', n = 0; bFrames(S.fr[p]).fr.forEach(function (x) { n += String(x.m).split(ch).length - 1; }); return n; };
  var room = function () { return isBow() ? bState(S.fr[S.turn]).pins : 0; };
  /* ---- board ---- */
  var built = '';
  function statDefs() {
    if (isBow()) return [['STRIKE', 'st'], ['SPARE', 'sp']];
    if (isSet()) return [['TO GO', 'st'], ['BREAK', 'sp']];
    var k = pbKeys(); return [[k[0] + ' BALL', 'st'], [M().last + ' BALL', 'sp']];
  }
  function build() {
    var N = NP(), m = $('main'), mid = $('mid'), sh = $('sheet'), sd = statDefs();
    Array.prototype.slice.call(m.querySelectorAll('.side')).forEach(function (e) { e.remove(); });

      var foot = el('div', 'foot'), st = el('div', 'stats');
      sd.forEach(function (a) { var d = el('div', 'stat'); d.appendChild(el('small', '', a[0])); var b = el('b', '', '0'); b.id = a[1] + p; d.appendChild(b); st.appendChild(d); });
      foot.appendChild(st); var to = el('div', 'stat tos'); to.appendChild(el('small', '', 'TIME-OUT')); var tw = el('span', 'tow'); tw.id = 'to' + p; to.appendChild(tw); foot.appendChild(to); sec.appendChild(foot);
      m.appendChild(sec);

    }

    built = N + S.cfg.mode + S.cfg.pb;
  }

  var signed = function (v) { return v > 0 ? '+' + v : String(v); };
  function scoreText(p) {

  var NAMES = { '+': '+（1点）', '-': '-（1点へらす）', '*': '*（残り秒数）', '/': '/（設定）', '.': '.（新しい試合）', 'Backspace': 'BackSpace（戻る）', 'Enter': 'Enter（交代）' };
  var loadMaps = function () { try { return JSON.parse(localStorage.getItem(MK) || '{}') || {}; } catch (e) { return {}; } };
  var noop = { preventDefault: function () {}, target: {} };
  if (TB) {
    $('ttl').textContent = 'TABLE ' + TB; document.title = 'TABLE ' + TB + ' | 3-CUSHION SCOREBOARD'; $('bKey').hidden = false;
    try { chan = new BroadcastChannel('vibes-count-pocket'); chan.onmessage = function (ev) { var m = ev.data || {}; if (m.t === TB && m.k) { if (!$('setL').hidden) closeSet(false); onKey(m.k, noop); } }; } catch (e) {}
  }
  function kmOpen() { if (!TB) return; KM = { i: 0, map: {} }; $('kmL').hidden = false; kmDraw(''); }
  function kmDraw(msg) { $('kmH').textContent = TB + '番台 キー設定（' + (KM.i + 1) + ' / ' + LOGI.length + '）'; $('kmT').textContent = '次のキーを押してください：' + (NAMES[LOGI[KM.i]] || LOGI[KM.i]); $('kmN').textContent = msg || 'この台のテンキーで押してください。'; }
  function kmKey(e) {
    if (e.key === 'Escape') { KM = null; $('kmL').hidden = true; return; }
    var code = e.code, maps = loadMaps(), other = 0;
    if (!code || /^(Shift|Control|Alt|Meta|NumLock|CapsLock)/.test(code)) return;
    Object.keys(maps).forEach(function (t) { if (+t !== TB && maps[t][code]) other = t; });
    if (other) return kmDraw('このキーは ' + other + '番台で使っています。別のキーを押してください。');
    if (KM.map[code]) return kmDraw('このキーは設定済みです。別のキーを押してください。');
    KM.map[code] = LOGI[KM.i]; KM.i++;
    if (KM.i >= LOGI.length) { maps[TB] = KM.map; try { localStorage.setItem(MK, JSON.stringify(maps)); } catch (x) {} KM = null; $('kmL').hidden = true; toast('キーを保存しました：' + TB + '番台'); return; }
    kmDraw('');
  }
  $('bKey').onclick = kmOpen;
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (KM) { e.preventDefault(); kmKey(e); return; }
    if (!$('rmL').hidden) { if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); $('rmL').hidden = true; } return; }
    if (TB) {
      var maps = loadMaps(), hitT = 0, lk = null;
      Object.keys(maps).forEach(function (t) { if (maps[t][e.code]) { hitT = +t; lk = maps[t][e.code]; } });
      if (hitT && hitT !== TB) { e.preventDefault(); if (chan) chan.postMessage({ t: hitT, k: lk }); return; }
      if (hitT === TB) {
        if (!$('setL').hidden) { if (lk === 'Enter' || (lk >= '0' && lk <= '9')) return; e.preventDefault(); return; }
        e.preventDefault(); onKey(lk, noop); return;
      }
      if (Object.keys(maps).length && (e.code.indexOf('Numpad') === 0 || e.code === 'Backspace') && $('setL').hidden) { e.preventDefault(); toast('このテンキーは未設定です。K を押して設定します。'); return; }
      if ((e.key === 'k' || e.key === 'K') && $('setL').hidden && !W) { e.preventDefault(); kmOpen(); return; }
    }
    onKey(e.key, e);
  });
  function onKey(k, e) {
    if (!$('setL').hidden) { if (k === 'Escape') { e.preventDefault(); closeSet(false); } else if (k === '/' && e.target.type === 'number') e.preventDefault(); return; }
    if (W) { if (wzKey(k)) e.preventDefault(); return; }
    if (!$('prL').hidden) {
      if (k === '+' || k === ' ') prToggle(); else if (k === '/') prReset(); else if (k === 'Enter' || k === 'Escape') prClose();
      else if (k >= '1' && k <= '9' && !pOn) { S.cfg.pm = +k; save(); prReset(); }
      else return; e.preventDefault(); return;
    }
    if (S.ready && !S.over) {
      if (k === 'Enter' || k === ' ') rdStart(); else if (k === '/') rdSwap(); else if (k === '-' || k === 'p' || k === 'P') prOpen();
      else if (k === 'Backspace') wzOpen(0); else if (k === 'f' || k === 'F') goFull();
      else if (k === '.' || k === 'Delete' || k === ',') wzOpen(0); else return;
      e.preventDefault(); return;
    }
    if (!$('winL').hidden) { if (k === 'Enter') { e.preventDefault(); newGame(false); wzOpen(0); } else if (k === 'Backspace') { e.preventDefault(); undo(); } return; }
    var hit = true;
    if (k >= '0' && k <= '9') digit(+k);
    else if (k === '+' || k === 'ArrowUp') add(1);
    else if (k === '-' && fresh()) prOpen();
    else if (k === 'p' || k === 'P') prOpen();
    else if (k === '-' || k === 'ArrowDown') add(-1);
    else if (k === 'Enter' || k === ' ') commit();
    else if (k === 'Backspace') undo();
    else if (k === '*') { if (tOn) tStop(); else tStart(); }
    else if (k === '/') openSet();
    else if (k === '.' || k === 'Delete' || k === ',') { var n = Date.now(); if (n - dotAt < 1500) { dotAt = 0; newGame(true); wzOpen(0); } else { dotAt = n; toast('もう一度 . を押すと新しい試合です'); } }
    else if (k === 'f' || k === 'F') goFull();
    else hit = false;
    if (hit) e.preventDefault();
  }
  /* offline: cache this page and what it loaded; keep the screen awake */
  if ('serviceWorker' in navigator && /^https:|^http:\/\/localhost/.test(location.href)) {
    navigator.serviceWorker.register('/sw-count.js', { scope: '/pages/count' }).then(function () { return navigator.serviceWorker.ready; }).then(function (reg) {
      var send = function () { try { var urls = performance.getEntriesByType('resource').map(function (r) { return r.name; }).filter(function (u) { return /fonts\.(googleapis|gstatic)\.com|\/img\//.test(u); }); if (reg.active) reg.active.postMessage({ type: 'cache', urls: urls }); } catch (e) {} };
      setTimeout(send, 3000); if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { setTimeout(send, 500); });
    }).catch(function () {});
  }
  var wl = null, wake = function () { try { if (navigator.wakeLock && document.visibilityState === 'visible') navigator.wakeLock.request('screen').then(function (l) { wl = l; }).catch(function () {}); } catch (e) {} };
  wake(); document.addEventListener('visibilitychange', wake); document.addEventListener('keydown', function once() { if (!wl) wake(); document.removeEventListener('keydown', once); });
  var qg = /[?&]g=(band|three)/.exec(location.search); if (qg && (S.cfg.game || 'three') !== qg[1]) { var cg = S.cfg; cg.game = qg[1]; S = def(cg); hist = []; S.ready = !cg.n.every(isDefName); }
  if (S.cfg.game === 'band') { $('ttl').textContent = (TB ? 'TABLE ' + TB + ' · ' : '') + 'BAND GAME'; document.title = 'バンド デジタルカウント｜VIBES BILLIARDS'; }
  var qm = /[?&]m=([a-z0-9]+)/.exec(location.search), viaMenu = false; if (qm && MODES[qm[1]] && (S.cfg.mode !== qm[1] || S.over)) { setMode(qm[1]); hist = []; S.ready = !S.cfg.n.every(isDefName); } if (qm && MODES[qm[1]]) viaMenu = true;
  render(); setInterval(drawTime, 500); if (S.over) showWin(); else if (S.cfg.n.every(isDefName) && fresh()) { wzOpen(0); if (viaMenu) { W.step = M().min === M().max ? 'mode' : 'count'; wzDraw(); } }
})();
