<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>スリークッション デジタルカウント（モニター＋テンキー）｜VIBES BILLIARDS</title>
<meta name="description" content="PCのモニターとテンキーで使えるスリークッションのデジタルカウント。得点・イニング・ハイラン・アベレージ・40秒タイマー。無料。">
<link rel="canonical" href="https://vibesbilliards.com/pages/count-3c">
<link rel="icon" href="/img/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+JP:wght@500;700;900&display=swap">
<style>
:root{--night:#171A22;--night2:#262A35;--line:#3A3F4C;--lime:#C0FC09;--chalk:#F3F4EF;--sub:#A3A8B5;--felt:#1E5AA8;--white:#FFFFFF;--yellow:#F2C200;--red:#D7262E}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--night);color:var(--chalk);font-family:"Noto Sans JP",system-ui,sans-serif;overflow:hidden}
[hidden]{display:none!important}
.num{font-family:Anton,Impact,"Arial Narrow","Noto Sans JP",sans-serif;font-variant-numeric:tabular-nums;line-height:.9}
.board{height:100vh;display:grid;grid-template-rows:auto 1fr auto;gap:1vh;padding:1.2vh 1.2vw}
.top{display:flex;align-items:center;justify-content:space-between;gap:2vw;min-height:5vh}
.top img{height:4.4vh;width:auto}
.top .ttl{font-weight:900;font-size:2.2vh;letter-spacing:.06em;color:var(--sub)}
.top button{font:inherit;font-weight:700;font-size:1.8vh;color:var(--chalk);background:var(--night2);border:1px solid var(--line);border-radius:999px;padding:.8vh 1.6vw;cursor:pointer}
.top button:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.main{display:grid;grid-template-columns:1fr minmax(16vw,20vw) 1fr;gap:1vw;min-height:0}
.side{position:relative;background:var(--felt);border-radius:2.4vh;display:grid;grid-template-rows:auto 1fr auto;padding:2vh 1.6vw;min-height:0;border:.6vh solid transparent;opacity:.55;transition:opacity .15s}
.side.on{opacity:1;border-color:var(--lime)}
.side .who{display:flex;align-items:center;gap:1vw;min-width:0}
.ball{width:5vh;height:5vh;border-radius:50%;flex:none;box-shadow:inset -.6vh -.6vh 0 rgba(0,0,0,.18)}
.p0 .ball{background:var(--white)}.p1 .ball{background:var(--yellow)}
.name{font-weight:900;font-size:4.6vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal{margin-left:auto;font-weight:700;font-size:2.4vh;white-space:nowrap}
.goal b{font-family:Anton,Impact,sans-serif;font-size:4.4vh;font-weight:400;margin-left:.4vw}
.score{display:flex;align-items:center;justify-content:center;font-size:min(46vh,26vw)}
.p0 .score{color:var(--white)}.p1 .score{color:var(--yellow)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.8vw}
.stat{background:rgba(23,26,34,.55);border-radius:1.4vh;padding:1vh .6vw;text-align:center}
.stat small{display:block;font-weight:700;font-size:1.9vh;color:#DCE3F0}
.stat b{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:5.4vh}
.turn{position:absolute;top:-2.2vh;left:50%;transform:translateX(-50%);background:var(--lime);color:var(--night);font-weight:900;font-size:2.2vh;padding:.4vh 1.4vw;border-radius:999px;white-space:nowrap}
.side:not(.on) .turn{display:none}
.mid{display:grid;grid-template-rows:auto auto 1fr;gap:1vh;min-height:0}
.box{background:var(--night2);border-radius:2vh;padding:1.4vh .8vw;text-align:center}
.box small{display:block;font-weight:700;font-size:2vh;color:var(--sub)}
.run b{font-size:15vh;color:var(--chalk)}
.inn b{font-size:9vh}
.timer b{font-size:11vh}
.timer.warn b{color:var(--yellow)}.timer.over b{color:var(--red)}
.timer .bar{height:1vh;background:var(--night);border-radius:1vh;overflow:hidden;margin-top:.8vh}
.timer .bar i{display:block;height:100%;width:100%;background:var(--lime);transform-origin:left}
.sheet{background:var(--night2);border-radius:1.6vh;padding:.8vh 1vw;display:grid;grid-template-columns:auto 1fr;gap:.4vh 1vw;align-items:center;font-size:2vh}
.sheet .lab{font-weight:700;color:var(--sub);white-space:nowrap;display:flex;align-items:center;gap:.5vw}
.sheet .lab i{width:1.8vh;height:1.8vh;border-radius:50%;display:inline-block}
.sheet .row{display:flex;gap:.35vw;overflow:hidden;justify-content:flex-start}
.sheet .row span{min-width:2.6vw;text-align:center;font-family:Anton,Impact,sans-serif;font-size:2.6vh;background:var(--night);border-radius:.6vh;padding:.2vh 0}
.sheet .row span.z{color:#6B7180}
.keys{display:flex;flex-wrap:wrap;gap:.5vh 1.2vw;justify-content:center;font-size:1.8vh;color:var(--sub);font-weight:700}
.keys kbd{font:inherit;color:var(--night);background:var(--chalk);border-radius:.6vh;padding:0 .7vw;margin-right:.4vw;font-weight:900}
.over-l{position:fixed;inset:0;background:rgba(10,12,16,.82);display:grid;place-items:center;z-index:5;padding:3vh 3vw}
.panel{background:var(--night2);border:1px solid var(--line);border-radius:2.4vh;padding:3vh 3vw;width:min(92vw,880px);max-height:94vh;overflow:auto}
.panel h2{margin:0 0 2vh;font-size:3.2vh}
.panel p{color:var(--sub);font-size:2vh;line-height:1.7;margin:.6vh 0 1.6vh}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1.6vh 2vw}
.f label{display:block;font-weight:700;font-size:1.9vh;margin-bottom:.6vh}
.f input,.f select{width:100%;min-width:0;font:inherit;font-size:2.6vh;font-weight:700;color:var(--chalk);background:var(--night);border:2px solid var(--line);border-radius:1.2vh;padding:1vh 1vw}
.f input:focus,.f select:focus{outline:none;border-color:var(--lime)}
.acts{display:flex;gap:1vw;justify-content:flex-end;margin-top:2.4vh;flex-wrap:wrap}
.btn{font:inherit;font-weight:900;font-size:2.2vh;border-radius:999px;padding:1.2vh 2.4vw;border:1px solid var(--line);background:var(--night);color:var(--chalk);cursor:pointer}
.btn.go{background:var(--lime);color:var(--night);border-color:var(--lime)}
.btn:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}
.win .big{font-family:Anton;font-size:9vh;line-height:1.1;margin:1vh 0}
.win table{width:100%;border-collapse:collapse;font-size:2.4vh;margin-top:1.6vh}
.win td,.win th{padding:.8vh .6vw;border-bottom:1px solid var(--line);text-align:center}
.win th{color:var(--sub);font-weight:700}
.toast{position:fixed;left:50%;bottom:9vh;transform:translateX(-50%);background:var(--chalk);color:var(--night);font-weight:900;font-size:2.4vh;border-radius:999px;padding:1vh 2vw;z-index:6}
@media (max-width:760px){
  html,body{overflow:auto}.board{height:auto;min-height:100vh}
  .main{grid-template-columns:1fr 1fr;grid-template-areas:"a b" "m m"}.p0{grid-area:a}.p1{grid-area:b}.mid{grid-area:m;grid-template-columns:1fr 1fr 1fr;grid-template-rows:auto}
  .score{font-size:30vw}.name{font-size:5vw}.goal{display:none}.ball{width:7vw;height:7vw}.stat b{font-size:6vw}.stat small{font-size:2.6vw}
  .run b,.inn b,.timer b{font-size:11vw}.box small,.keys,.sheet{font-size:3vw}.top .ttl{display:none}.turn{font-size:3vw;top:-3.4vw}
  .panel h2{font-size:5vw}.panel p,.f label{font-size:3.4vw}.f input,.f select,.btn{font-size:4vw}.grid2{grid-template-columns:1fr}
  .sheet .row span{min-width:7vw;font-size:4vw}.top button{font-size:3.2vw;padding:1.6vw 3vw}.top img{height:9vw}
}
</style>
</head>
<body>
<div class="board" id="board">
  <div class="top">
    <a href="/" aria-label="VIBES BILLIARDS トップ"><img src="/img/vibes-logo.png" alt="VIBES BILLIARDS"></a>
    <span class="ttl">スリークッション デジタルカウント</span>
    <span style="display:flex;gap:.8vw"><button type="button" id="bSet">設定（/）</button><button type="button" id="bFull">全画面（F）</button></span>
  </div>
  <div class="main">
    <section class="side p0" id="s0" aria-label="先攻">
      <span class="turn">撞いています</span>
      <div class="who"><span class="ball"></span><span class="name" id="n0"></span><span class="goal">持ち点<b id="g0"></b></span></div>
      <div class="score num" id="sc0">0</div>
      <div class="stats"><div class="stat"><small>イニング</small><b id="in0">0</b></div><div class="stat"><small>ハイラン</small><b id="hr0">0</b></div><div class="stat"><small>アベレージ</small><b id="av0">0.000</b></div></div>
    </section>
    <div class="mid">
      <div class="box run"><small>このイニングの得点</small><b class="num" id="run">0</b></div>
      <div class="box inn"><small>イニング</small><b class="num" id="inn">1</b><small id="lim"></small></div>
      <div class="box timer" id="tbox"><small>タイマー（＊で開始）</small><b class="num" id="tm">40</b><div class="bar"><i id="tbar"></i></div></div>
    </div>
    <section class="side p1" id="s1" aria-label="後攻">
      <span class="turn">撞いています</span>
      <div class="who"><span class="ball"></span><span class="name" id="n1"></span><span class="goal">持ち点<b id="g1"></b></span></div>
      <div class="score num" id="sc1">0</div>
      <div class="stats"><div class="stat"><small>イニング</small><b id="in1">0</b></div><div class="stat"><small>ハイラン</small><b id="hr1">0</b></div><div class="stat"><small>アベレージ</small><b id="av1">0.000</b></div></div>
    </section>
  </div>
  <div>
    <div class="sheet"><span class="lab"><i style="background:#fff"></i>先攻</span><div class="row" id="r0"></div><span class="lab"><i style="background:#F2C200"></i>後攻</span><div class="row" id="r1"></div></div>
    <div class="keys" style="margin-top:1vh">
      <span><kbd>＋</kbd>1点</span><span><kbd>−</kbd>1点もどす</span><span><kbd>0〜9</kbd>得点を数字で入力</span><span><kbd>Enter</kbd>交代（イニング終了）</span><span><kbd>BackSpace</kbd>ひとつ前にもどす</span><span><kbd>＊</kbd>タイマー</span><span><kbd>/</kbd>設定</span><span><kbd>.</kbd>2回で新しいゲーム</span>
    </div>
  </div>
</div>

<div class="over-l" id="setL" hidden>
  <form class="panel" id="setF">
    <h2>ゲームの設定</h2>
    <p>名前はふつうのキーボードで入力します。数字はテンキーで入力できます。Enter で保存して始めます。</p>
    <div class="grid2">
      <div class="f"><label for="fn0">先攻（白）の名前</label><input id="fn0" maxlength="14" autocomplete="off"></div>
      <div class="f"><label for="fn1">後攻（黄）の名前</label><input id="fn1" maxlength="14" autocomplete="off"></div>
      <div class="f"><label for="fg0">先攻の持ち点</label><input id="fg0" type="number" inputmode="numeric" min="1" max="999"></div>
      <div class="f"><label for="fg1">後攻の持ち点</label><input id="fg1" type="number" inputmode="numeric" min="1" max="999"></div>
      <div class="f"><label for="fl">イニング制限（0＝なし）</label><input id="fl" type="number" inputmode="numeric" min="0" max="999"></div>
      <div class="f"><label for="ft">タイマーの秒数（0＝使わない）</label><input id="ft" type="number" inputmode="numeric" min="0" max="180"></div>
      <div class="f"><label for="fe">後攻の裏撞き（先攻が先に上がったとき）</label><select id="fe"><option value="1">あり</option><option value="0">なし</option></select></div>
      <div class="f"><label for="fs">音（残り10秒・時間切れ）</label><select id="fs"><option value="1">鳴らす</option><option value="0">鳴らさない</option></select></div>
    </div>
    <div class="acts"><button type="button" class="btn" id="bSwap">先攻・後攻を入れ替える</button><button type="button" class="btn" id="bNew">新しいゲームにする</button><button type="submit" class="btn go">保存して閉じる（Enter）</button></div>
  </form>
</div>

<div class="over-l" id="winL" hidden>
  <div class="panel win" role="dialog" aria-label="ゲーム終了">
    <h2>ゲーム終了</h2>
    <div class="big" id="wName"></div>
    <table><thead><tr><th></th><th>得点</th><th>イニング</th><th>ハイラン</th><th>アベレージ</th></tr></thead><tbody id="wT"></tbody></table>
    <div class="acts"><button type="button" class="btn" id="bBack">ひとつ前にもどす（BackSpace）</button><button type="button" class="btn go" id="bAgain">新しいゲーム（Enter）</button></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
  var KEY = 'vibes-count-3c-v1';
  var $ = function (id) { return document.getElementById(id); };
  var def = function () { return { cfg: { n: ['先攻', '後攻'], g: [25, 25], lim: 0, t: 40, eq: 1, snd: 1 }, sc: [0, 0], inn: [[], []], run: 0, typed: false, turn: 0, over: false }; };
  var S = def(), hist = [], tLeft = 0, tOn = false, tId = null, dotAt = 0, actx = null;
  try { var raw = localStorage.getItem(KEY); if (raw) { var o = JSON.parse(raw); if (o && o.cfg && o.sc) S = Object.assign(def(), o); } } catch (e) {}
  var save = function () { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
  var snap = function () { hist.push(JSON.stringify(S)); if (hist.length > 400) hist.shift(); };
  var hi = function (p) { return S.inn[p].length ? Math.max.apply(null, S.inn[p]) : 0; };
  var avg = function (p) { return S.inn[p].length ? (S.sc[p] / S.inn[p].length).toFixed(3) : '0.000'; };
  var room = function () { return S.cfg.g[S.turn] - S.sc[S.turn]; };
  var toast = function (m) { var t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { t.hidden = true; }, 1800); };
  function beep(f, ms) {
    if (!S.cfg.snd) return;
    try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); var o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = f; o.connect(g); g.connect(actx.destination); g.gain.value = .18; o.start(); o.stop(actx.currentTime + ms / 1000); } catch (e) {}
  }
  function render() {
    for (var p = 0; p < 2; p++) {
      $('n' + p).textContent = S.cfg.n[p]; $('g' + p).textContent = S.cfg.g[p];
      $('sc' + p).textContent = S.sc[p] + (p === S.turn && !S.over ? S.run : 0);
      $('in' + p).textContent = S.inn[p].length; $('hr' + p).textContent = Math.max(hi(p), p === S.turn ? S.run : 0); $('av' + p).textContent = avg(p);
      $('s' + p).classList.toggle('on', p === S.turn && !S.over);
      var r = $('r' + p), a = S.inn[p].slice(-18); r.textContent = '';
      a.forEach(function (v) { var s = document.createElement('span'); s.textContent = v; if (!v) s.className = 'z'; r.appendChild(s); });
    }
    $('run').textContent = S.run;
    $('inn').textContent = S.inn[S.turn].length + (S.over ? 0 : 1);
    $('lim').textContent = S.cfg.lim ? S.cfg.lim + 'イニングまで' : '';
    $('tbox').hidden = !S.cfg.t;
    drawTimer(); save();
  }
  function drawTimer() {
    var T = S.cfg.t || 1, v = tOn ? Math.max(0, Math.ceil(tLeft)) : S.cfg.t;
    $('tm').textContent = v; $('tbar').style.transform = 'scaleX(' + (tOn ? Math.max(0, tLeft) / T : 1) + ')';
    $('tbox').classList.toggle('warn', tOn && tLeft <= 10 && tLeft > 0); $('tbox').classList.toggle('over', tOn && tLeft <= 0);
  }
  function tStop() { tOn = false; clearInterval(tId); tId = null; drawTimer(); }
  function tStart() {
    if (!S.cfg.t || S.over) return; tStop(); tOn = true; tLeft = S.cfg.t; var last = Date.now(), warned = false, done = false;
    tId = setInterval(function () { var n = Date.now(); tLeft -= (n - last) / 1000; last = n; if (!warned && tLeft <= 10) { warned = true; beep(880, 160); } if (!done && tLeft <= 0) { done = true; beep(330, 900); } drawTimer(); }, 100);
    drawTimer();
  }
  var tKick = function () { if (tOn) tStart(); };
  function add(n) { if (S.over) return; var v = Math.max(0, Math.min(room(), S.run + n)); if (v === S.run) { if (n > 0) toast('持ち点に届きました。Enter で確定します'); return; } S.run = v; S.typed = false; tKick(); render(); }
  function digit(d) { if (S.over) return; var v = S.typed ? S.run * 10 + d : d; if (v > room()) v = d > room() ? room() : d; S.run = v; S.typed = true; render(); }
  function finish() { S.over = true; tStop(); render(); showWin(); }
  function commit() {
    if (S.over) return; snap();
    var p = S.turn; S.sc[p] += S.run; S.inn[p].push(S.run); S.run = 0; S.typed = false;
    var done0 = S.sc[0] >= S.cfg.g[0], done1 = S.sc[1] >= S.cfg.g[1];
    if (p === 0) { if (done0 && !S.cfg.eq) return finish(); S.turn = 1; }
    else { if (done0 || done1) return finish(); if (S.cfg.lim && S.inn[1].length >= S.cfg.lim) return finish(); S.turn = 0; }
    tKick(); render();
  }
  function undo() {
    if (!S.over && S.run > 0) { S.run = 0; S.typed = false; render(); return; }
    if (!hist.length) { toast('これ以上もどせません'); return; }
    S = JSON.parse(hist.pop()); $('winL').hidden = true; render();
  }
  function newGame(keep) { snap(); var c = S.cfg; S = def(); S.cfg = c; if (!keep) hist = []; tStop(); $('winL').hidden = true; render(); }
  function showWin() {
    var pct = function (p) { return S.sc[p] / S.cfg.g[p]; }, w = pct(0) === pct(1) ? -1 : (pct(0) > pct(1) ? 0 : 1);
    $('wName').textContent = w < 0 ? '引き分け' : S.cfg.n[w] + ' の勝ち';
    var tb = $('wT'); tb.textContent = '';
    [0, 1].forEach(function (p) { var tr = document.createElement('tr'); [S.cfg.n[p], S.sc[p] + ' / ' + S.cfg.g[p], S.inn[p].length, hi(p), avg(p)].forEach(function (v, i) { var c = document.createElement(i ? 'td' : 'th'); c.textContent = v; tr.appendChild(c); }); tb.appendChild(tr); });
    $('winL').hidden = false;
  }
  function openSet() {
    $('fn0').value = S.cfg.n[0]; $('fn1').value = S.cfg.n[1]; $('fg0').value = S.cfg.g[0]; $('fg1').value = S.cfg.g[1];
    $('fl').value = S.cfg.lim; $('ft').value = S.cfg.t; $('fe').value = S.cfg.eq; $('fs').value = S.cfg.snd;
    $('setL').hidden = false; $('fg0').focus(); $('fg0').select();
  }
  function closeSet(apply) {
    if (apply) {
      var num = function (id, lo, hi, d) { var v = parseInt($(id).value, 10); return isNaN(v) ? d : Math.max(lo, Math.min(hi, v)); };
      S.cfg.n = [$('fn0').value.trim() || '先攻', $('fn1').value.trim() || '後攻'];
      S.cfg.g = [num('fg0', 1, 999, 25), num('fg1', 1, 999, 25)]; S.cfg.lim = num('fl', 0, 999, 0); S.cfg.t = num('ft', 0, 180, 40);
      S.cfg.eq = +$('fe').value; S.cfg.snd = +$('fs').value;
      for (var p = 0; p < 2; p++) if (S.sc[p] > S.cfg.g[p]) S.cfg.g[p] = S.sc[p];
      if (S.run > room()) S.run = Math.max(0, room());
    }
    $('setL').hidden = true; tStop(); render();
  }
  function full() { var d = document; if (d.fullscreenElement) d.exitFullscreen(); else if (d.documentElement.requestFullscreen) d.documentElement.requestFullscreen().catch(function () {}); }

  $('setF').addEventListener('submit', function (e) { e.preventDefault(); closeSet(true); });
  $('bSet').onclick = openSet; $('bFull').onclick = full;
  $('bSwap').onclick = function () { var a = $('fn0').value; $('fn0').value = $('fn1').value; $('fn1').value = a; a = $('fg0').value; $('fg0').value = $('fg1').value; $('fg1').value = a; };
  $('bNew').onclick = function () { closeSet(true); newGame(true); toast('新しいゲームを始めます'); };
  $('bAgain').onclick = function () { newGame(false); }; $('bBack').onclick = undo;

  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key;
    if (!$('setL').hidden) { if (k === 'Escape') { e.preventDefault(); closeSet(false); } else if (k === '/' && e.target.type === 'number') e.preventDefault(); return; }
    if (!$('winL').hidden) { if (k === 'Enter') { e.preventDefault(); newGame(false); } else if (k === 'Backspace') { e.preventDefault(); undo(); } return; }
    var hit = true;
    if (k >= '0' && k <= '9') digit(+k);
    else if (k === '+' || k === 'ArrowUp') add(1);
    else if (k === '-' || k === 'ArrowDown') add(-1);
    else if (k === 'Enter' || k === ' ') commit();
    else if (k === 'Backspace') undo();
    else if (k === '*') { if (tOn) tStop(); else tStart(); }
    else if (k === '/') openSet();
    else if (k === '.' || k === 'Delete' || k === ',') { var n = Date.now(); if (n - dotAt < 1500) { dotAt = 0; newGame(true); toast('新しいゲームを始めます（BackSpace でもどせます）'); } else { dotAt = n; toast('もう一度「.」を押すと新しいゲーム'); } }
    else if (k === 'f' || k === 'F') full();
    else hit = false;
    if (hit) e.preventDefault();
  });
  render(); if (S.over) showWin();
})();
</script>
</body>
</html>
