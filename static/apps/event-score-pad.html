<!doctype html>
<html lang="ja" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>スコア操作｜VIBES DIGITAL LAB</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/img/favicon-64.png">
<style>
/* Event scoreboard, operating side. Hidden page: opened only by its address (issued by /pages/digital-lab-admin).
   ?match=<id> keeps each table's score apart. ?cfg=<settings> (from the admin page) is taken in once per issue.
   Landscape = tablet beside the table (the opponent keeps the score). Portrait = phone in one hand (a referee): the same actions as large buttons.
   This page owns the score and sends it to /event-score-obs through the scoreboard relay; open it on ONE device per table. */
@font-face{font-family:VLNum;src:url(/fonts/vibes-num.woff2) format("woff2");font-display:swap}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0B192C;color:#fff;font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
[hidden]{display:none!important}
button{font-family:inherit}
#app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:1.1vh;padding:max(1.4vh,env(safe-area-inset-top)) max(1.4vw,env(safe-area-inset-right)) max(1.4vh,env(safe-area-inset-bottom)) max(1.4vw,env(safe-area-inset-left))}
.top{display:flex;align-items:center;gap:1vw;min-height:6.5vh}
.top .mt{display:flex;align-items:center;gap:.6vw;background:#12284A;border-radius:1.2vh;padding:.6vh 1vw;font-weight:800;font-size:2.1vh}
.top .mt small{font-size:1.7vh;color:#B9C4D6}
.top input{font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;font-weight:800;font-size:2.1vh;color:#fff;background:#0B192C;border:.2vh solid #2B4A7A;border-radius:.9vh;padding:.7vh .8vw;min-width:0;-webkit-user-select:text;user-select:text}
#iMatch{width:11vw}#iTitle{width:18vw}#iRound{width:10vw}
.top select{font:800 2.1vh/1.2 "Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;color:#0B192C;background:#FFD700;border:0;border-radius:.9vh;padding:.8vh .6vw;max-width:14vw}
.st{margin-left:auto;display:flex;align-items:center;gap:.6vw;font-weight:800;font-size:2vh;white-space:nowrap}.st i{width:1.6vh;height:1.6vh;border-radius:50%;background:#7A8699}.st.on i{background:#39D98A}
.tb{appearance:none;border:.2vh solid #2B4A7A;background:#12284A;color:#fff;font:800 2.1vh/1 "Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;border-radius:1.2vh;padding:0 1.4vw;min-height:6vh;cursor:pointer;white-space:nowrap}
.tb.dg{border-color:#FF6B6B;color:#FFD1D1}
.info{display:flex;align-items:center;gap:.8vw;min-height:4.6vh;font-weight:800;font-size:2.1vh;flex-wrap:nowrap;overflow:hidden}
.info span{background:#12284A;border-radius:999px;padding:.7vh 1.2vw;white-space:nowrap}
.info .hot{background:#FFD700;color:#0B192C}
.info .ban{background:#E11D48;color:#fff;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;border-radius:1.2vh}
.main{display:grid;grid-template-columns:minmax(0,1fr) 22vw minmax(0,1fr);gap:1.2vw;min-height:0}
.pl{min-height:0;background:#12284A;border:.7vh solid #12284A;border-radius:3vh;padding:1.4vh 1.4vw;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:.8vh}
.pl.on{border-color:#FFD700;box-shadow:0 0 0 .4vh rgba(255,215,0,.25)}
.pl .hd{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.8vw;align-items:center}
.ball{width:4.2vh;height:4.2vh;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff 0 12%,var(--b) 40%);box-shadow:inset -.5vh -.6vh 0 rgba(0,0,0,.18)}
.nm{font:900 3.4vh/1.2 "Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;color:#fff;background:transparent;border:0;border-bottom:.3vh solid #2B4A7A;border-radius:0;padding:.4vh .2vw;width:100%;min-width:0;-webkit-user-select:text;user-select:text}
.hc{display:flex;align-items:center;gap:.4vw;font-weight:800;font-size:1.9vh;color:#B9C4D6;white-space:nowrap}
.hc input{font:900 3vh/1 VLNum,"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;color:#FFD700;background:#0B192C;border:.2vh solid #2B4A7A;border-radius:.9vh;width:7.5vw;padding:.6vh .3vw;text-align:center;-webkit-user-select:text;user-select:text}
.pl .sc{min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3vh}
.pl .sc b{font:400 27vh/.9 VLNum,system-ui,sans-serif;color:#fff;letter-spacing:-.02em}
.pl.b .sc b{color:#FFD700}
.pl .sc .rm{font-weight:800;font-size:2.2vh;color:#B9C4D6;min-height:2.8vh}
.pl .sc .rm.fin{color:#0B192C;background:#FFD700;border-radius:999px;padding:.3vh 1.4vw}
.stt{display:flex;gap:1.6vw;font-weight:800;font-size:2.2vh;color:#B9C4D6}.stt em{font:400 3.1vh/1 VLNum,system-ui,sans-serif;font-style:normal;color:#fff;margin-left:.5vw}
.rowb{display:flex;gap:.8vw;align-items:center;justify-content:center;flex-wrap:wrap}
.tn,.tob{appearance:none;border:.2vh solid #2B4A7A;background:transparent;color:#B9C4D6;font:800 1.8vh/1 "Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;border-radius:999px;padding:.9vh 1vw;cursor:pointer;white-space:nowrap;min-height:4.4vh}
.pl.on .tn{background:#FFD700;border-color:#FFD700;color:#0B192C}
.tob{border-color:#38BDF8;color:#BAE6FD}.tob:disabled{opacity:.35}
.pl .bt{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.4fr);gap:1vw}
.pl .bt button{appearance:none;border:0;cursor:pointer;border-radius:2.2vh;min-height:14vh;font:400 8vh/1 VLNum,system-ui,sans-serif}
.pl .bt .mn{background:#0B192C;color:#fff;box-shadow:inset 0 0 0 .3vh #2B4A7A;font-size:5.4vh}
.pl .bt .pp{background:#fff;color:#0B192C}.pl.b .bt .pp{background:#FFD700}
button:active{transform:scale(.97)}
.mid{min-height:0;display:flex;flex-direction:column;gap:1.1vh}
.inn{background:#12284A;border-radius:3vh;padding:1.2vh 1vw;display:flex;flex-direction:column;align-items:center;gap:.4vh}
.inn small{font-weight:800;font-size:2.1vh;color:#B9C4D6}
.inn b{font:400 12vh/.95 VLNum,system-ui,sans-serif}
.inn div{display:grid;grid-template-columns:1fr 1fr;gap:.8vw;width:100%}
.inn button,.ckp button{appearance:none;border:0;cursor:pointer;border-radius:1.6vh;min-height:7vh;background:#0B192C;color:#fff;box-shadow:inset 0 0 0 .3vh #2B4A7A;font:400 4vh/1 VLNum,system-ui,sans-serif}
.ckp{background:#12284A;border-radius:3vh;padding:1.2vh 1vw;display:flex;flex-direction:column;align-items:center;gap:.6vh}
.ckp small{font-weight:800;font-size:2vh;color:#B9C4D6}
.ckp b{font:400 11vh/.95 VLNum,system-ui,sans-serif}
.ckp.warn b{color:#FF6B6B;animation:bl .5s steps(2) infinite}
.ckp div{display:grid;grid-template-columns:1.4fr 1fr;gap:.8vw;width:100%}
.ckp button{font:900 2.2vh/1 "Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif}.ckp .go{background:#38BDF8;color:#0B192C;box-shadow:none}
@keyframes bl{50%{opacity:.25}}
.nx{flex:1;min-height:9vh;appearance:none;border:0;cursor:pointer;border-radius:3vh;background:#FFD700;color:#0B192C;font:900 5vh/1.2 "Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6vh}
.nx small{font-size:2vh;font-weight:800}
.dlg{position:fixed;inset:0;background:rgba(5,12,24,.86);display:flex;align-items:center;justify-content:center;z-index:9;padding:3vmin}
.dlg>div{background:#12284A;border:.3vh solid #2B4A7A;border-radius:3vh;padding:3.4vmin;max-width:min(92vw,980px);width:100%;max-height:94vh;overflow:auto;display:flex;flex-direction:column;gap:2.2vmin;text-align:center}
.dlg b.h{font-size:3.6vmin;font-weight:900;line-height:1.5}.dlg p{margin:0;font-size:2.3vmin;font-weight:700;line-height:1.7;color:#B9C4D6}
.dlg nav{display:grid;grid-template-columns:1fr 1fr;gap:1.6vmin}
.dlg nav button{appearance:none;border:0;cursor:pointer;border-radius:2vmin;min-height:max(56px,9vmin);font:900 max(15px,2.8vmin)/1.3 "Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;padding:0 1vmin}
.dlg .no{background:#0B192C;color:#fff;box-shadow:inset 0 0 0 .3vh #2B4A7A}.dlg .ok{background:#FF6B6B;color:#0B192C}.dlg .ye{background:#FFD700;color:#0B192C}
.res{width:100%;border-collapse:collapse;font-weight:800;font-size:max(14px,2.5vmin)}
.res th{font-size:max(11px,1.9vmin);color:#B9C4D6;font-weight:800;padding:.8vmin}
.res td{padding:1.2vmin .8vmin;border-top:.2vh solid #2B4A7A;font:400 max(22px,5vmin)/1 VLNum,system-ui,sans-serif}
.res td:first-child{font:900 max(15px,3vmin)/1.3 "Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;text-align:left}
.res tr.w td{color:#FFD700}
.win{font-size:max(18px,4.2vmin);font-weight:900;color:#0B192C;background:#FFD700;border-radius:1.6vmin;padding:1.2vmin}
/* ---- phone in one hand (portrait) ---- */
#ph{display:none}
@media (orientation:portrait){
  #app{display:none}
  html,body{overflow:auto}
  #ph{display:flex;flex-direction:column;gap:10px;min-height:100dvh;padding:max(10px,env(safe-area-inset-top)) 12px max(14px,env(safe-area-inset-bottom))}
  .ph-top{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px}.ph-top b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
  .ph-sc{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch}
  .ph-p{background:#12284A;border:4px solid #12284A;border-radius:18px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
  .ph-p.on{border-color:#FFD700}
  .ph-p span{font-weight:900;font-size:14px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ph-p b{font:400 64px/1 VLNum,system-ui,sans-serif}.ph-p.b b{color:#FFD700}
  .ph-p small{font-weight:800;font-size:11.5px;color:#B9C4D6;white-space:nowrap}
  .ph-in{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800;font-size:11px;color:#B9C4D6;min-width:58px}
  .ph-in b{font:400 34px/1 VLNum,system-ui,sans-serif;color:#fff}
  .ph-in .ck{font:400 30px/1 VLNum,system-ui,sans-serif;color:#38BDF8}.ph-in .ck.warn{color:#FF6B6B;animation:bl .5s steps(2) infinite}
  .ph-ban{background:#E11D48;border-radius:12px;padding:10px 12px;font-weight:900;font-size:14.5px;line-height:1.5;text-align:center}
  .ph-ban.q{background:#12284A;color:#B9C4D6;font-size:13px}
  .ph-b{appearance:none;border:0;cursor:pointer;border-radius:20px;font-weight:900;color:#0B192C}
  .ph-plus{flex:1;min-height:150px;background:#fff;font:400 84px/1 VLNum,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
  .ph-plus.b{background:#FFD700}.ph-plus small{font:900 15px/1.2 "Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif}
  .ph-next{min-height:92px;background:#FFD700;font-size:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.ph-next small{font-size:13px;font-weight:800}
  .ph-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .ph-s{min-height:68px;background:#12284A;color:#fff;box-shadow:inset 0 0 0 2px #2B4A7A;font-size:17px;line-height:1.3;padding:4px}
  .ph-s.go{background:#38BDF8;color:#0B192C;box-shadow:none}.ph-s:disabled{opacity:.35}
  details{background:#12284A;border-radius:16px;padding:4px 12px}
  summary{font-weight:900;font-size:15px;padding:12px 0;cursor:pointer}
  .ph-f{display:grid;gap:10px;padding:4px 0 14px}
  .ph-f label{display:flex;flex-direction:column;gap:4px;font-weight:800;font-size:12.5px;color:#B9C4D6}
  .ph-f input{font:800 17px/1.2 "Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;color:#fff;background:#0B192C;border:2px solid #2B4A7A;border-radius:12px;padding:12px;min-width:0;-webkit-user-select:text;user-select:text}
  .ph-f .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .ph-f button{appearance:none;cursor:pointer;min-height:54px;border-radius:14px;border:2px solid #FF6B6B;background:transparent;color:#FFD1D1;font-weight:900;font-size:16px}
  .dlg nav{grid-template-columns:1fr}
}
</style>
</head>
<body>
<!-- tablet, landscape -->
<div id="app">
  <div class="top">
    <label class="mt"><small>試合ID</small><input id="iMatch" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="試合ID"></label>
    <label class="mt"><small>表示名</small><input data-f="title" autocomplete="off" maxlength="24" aria-label="配信に出すタイトル" id="iTitle"></label>
    <label class="mt"><small>回戦</small><select id="sRound" aria-label="いま何回戦か"><option value="">表示しない</option><option>予選リーグ</option><option>1回戦</option><option>2回戦</option><option>3回戦</option><option>敗者1回戦</option><option>敗者2回戦</option><option>敗者3回戦</option><option>準々決勝</option><option>準決勝</option><option>3位決定戦</option><option>決勝</option><option value="*">その他（入力する）</option></select><input id="iRound" maxlength="12" autocomplete="off" aria-label="回戦を入力" hidden></label>
    <div class="st" data-st><i></i><span data-o="st">つないでいます</span></div>
    <button class="tb dg" type="button" data-act="reset">リセット</button>
  </div>
  <div class="info"><span data-o="mode"></span><span data-o="lim" hidden></span><span data-o="ckc" hidden></span><span class="ban" data-o="ban" hidden></span></div>
  <div class="main">
    <section class="pl a" data-pl="0"><div class="hd"><span class="ball" style="--b:#E9EEF5"></span><input class="nm" data-f="n0" maxlength="16" autocomplete="off" aria-label="選手A（白球）の名前"><label class="hc"><span data-o="hl">持ち点</span><input data-f="h0" inputmode="numeric" maxlength="3" aria-label="選手Aの持ち点"></label></div>
      <div class="sc"><b data-o="s0">0</b><span class="rm" data-o="r0"></span><div class="stt" data-stats><span>ハイラン<em data-o="x0">0</em></span><span>アベレージ<em data-o="v0">-</em></span></div><div class="rowb"><button class="tn" type="button" data-turn="0" data-o="tn0">この選手の番にする</button><button class="tob" type="button" data-to="0" hidden></button></div></div>
      <div class="bt"><button class="mn" type="button" data-add="0,-1" aria-label="選手Aの得点を1点へらす">−1</button><button class="pp" type="button" data-add="0,1" aria-label="選手Aに1点入れる">+1</button></div></section>
    <div class="mid">
      <div class="inn" data-inns><small>イニング</small><b data-o="inn">1</b><div><button type="button" data-inn="-1" aria-label="イニングを1つ戻す">−1</button><button type="button" data-inn="1" aria-label="イニングを1つ進める">+1</button></div></div>
      <div class="ckp" data-ck hidden><small>ショットクロック</small><b data-o="ck">40</b><div><button class="go" type="button" data-act="ckgo" data-o="ckb">スタート</button><button type="button" data-act="ckre">戻す</button></div></div>
      <button class="nx" type="button" data-act="next"><span data-o="nxl">交代</span><small data-o="nxt"></small></button>
    </div>
    <section class="pl b" data-pl="1"><div class="hd"><span class="ball" style="--b:#FFD700"></span><input class="nm" data-f="n1" maxlength="16" autocomplete="off" aria-label="選手B（黄球）の名前"><label class="hc"><span data-o="hl">持ち点</span><input data-f="h1" inputmode="numeric" maxlength="3" aria-label="選手Bの持ち点"></label></div>
      <div class="sc"><b data-o="s1">0</b><span class="rm" data-o="r1"></span><div class="stt" data-stats><span>ハイラン<em data-o="x1">0</em></span><span>アベレージ<em data-o="v1">-</em></span></div><div class="rowb"><button class="tn" type="button" data-turn="1" data-o="tn1">この選手の番にする</button><button class="tob" type="button" data-to="1" hidden></button></div></div>
      <div class="bt"><button class="mn" type="button" data-add="1,-1" aria-label="選手Bの得点を1点へらす">−1</button><button class="pp" type="button" data-add="1,1" aria-label="選手Bに1点入れる">+1</button></div></section>
  </div>
</div>
<!-- phone, portrait -->
<div id="ph">
  <div class="ph-top"><b data-o="ttl"></b><div class="st" data-st><i></i><span data-o="st">つないでいます</span></div></div>
  <div class="ph-sc">
    <div class="ph-p a" data-pl="0"><span data-o="n0"></span><b data-o="s0">0</b><small data-o="m0"></small></div>
    <div class="ph-in"><span data-o="innl">イニング</span><b data-o="inn">1</b><span data-o="lims"></span><span class="ck" data-o="ck" data-ck hidden></span></div>
    <div class="ph-p b" data-pl="1"><span data-o="n1"></span><b data-o="s1">0</b><small data-o="m1"></small></div>
  </div>
  <div class="ph-ban" data-o="ban" hidden></div>
  <button class="ph-b ph-plus" type="button" data-add="t,1" data-o="plus">+1<small data-o="plusn"></small></button>
  <button class="ph-b ph-next" type="button" data-act="next"><span data-o="nxl">交代</span><small data-o="nxt"></small></button>
  <div class="ph-row"><button class="ph-b ph-s" type="button" data-add="t,-1">−1点<br>（まちがいを戻す）</button><button class="ph-b ph-s" type="button" data-to="t" data-o="tot" hidden></button></div>
  <div class="ph-row" data-ck hidden><button class="ph-b ph-s go" type="button" data-act="ckgo" data-o="ckb">クロック スタート</button><button class="ph-b ph-s" type="button" data-act="ckre">クロックを戻す</button></div>
  <details><summary>名前・持ち点・番の入れ替え</summary><div class="ph-f">
    <div class="two"><label>選手A（白球）<input data-f="n0" maxlength="16" autocomplete="off"></label><label><span data-o="hl">持ち点</span><input data-f="h0" inputmode="numeric" maxlength="3"></label></div>
    <div class="two"><label>選手B（黄球）<input data-f="n1" maxlength="16" autocomplete="off"></label><label><span data-o="hl">持ち点</span><input data-f="h1" inputmode="numeric" maxlength="3"></label></div>
    <label>表示名（大会名）<input data-f="title" maxlength="24" autocomplete="off"></label>
    <div class="two"><button type="button" data-turn="0" style="border-color:#2B4A7A;color:#fff">Aの番にする</button><button type="button" data-turn="1" style="border-color:#2B4A7A;color:#fff">Bの番にする</button></div>
    <div class="two" data-inns><button type="button" data-inn="-1" style="border-color:#2B4A7A;color:#fff">イニング −1</button><button type="button" data-inn="1" style="border-color:#2B4A7A;color:#fff">イニング +1</button></div>
    <button type="button" data-act="reset">スコアを0に戻す（リセット）</button>
  </div></details>
</div>
<div class="dlg" id="dlg" hidden><div><b class="h">スコアとイニングを、0に戻しますか？</b><p>選手の名前と持ち点は残ります。配信とモニターの画面も、すぐに0になります。</p><nav><button class="no" type="button" data-act="dno">やめる</button><button class="ok" type="button" data-act="dok">0に戻す</button></nav></div></div>
<div class="dlg" id="fin" hidden><div><b class="h">試合終了</b><div class="win" data-o="win"></div><table class="res" id="resT"></table><p data-o="why"></p><nav><button class="no" type="button" data-act="undo">結果を取り消して、試合に戻る</button><button class="ye" type="button" data-act="newgame">次の試合へ（0に戻す）</button></nav></div></div>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); }, $$ = function (s) { return [].slice.call(document.querySelectorAll(s)); };
  var WSH = /\.workers\.dev$/.test(location.host) ? location.host : 'vibes-site1.quiet-darkness-2185.workers.dev';
  function clean(m) { return String(m || '').toLowerCase().replace(/[^a-z0-9_-]/g, '').slice(0, 40); }

  var custom = false, KEY = 'vibes-event-score:' + match, S = null, ws = null, tries = 0, timer = null;
  function blank() { return { type: 'state', v: 2, m: match, title: 'Queen Cup 2026-2027', round: '', inn: 1, turn: 0, p: [{ n: 'PLAYER A', h: 0, s: 0, hr: 0, run: 0, to: 0 }, { n: 'PLAYER B', h: 0, s: 0, hr: 0, run: 0, to: 0 }], cfg: cfgOf(null), over: null, rep: false, ck: null, t: 0 }; }
  var P = function () { return S.cfg.mode === 'pocket'; };

  function valid(o) { return o && o.type === 'state' && o.p && o.p.length === 2 && typeof o.inn === 'number'; }

  /* settings handed over by the admin page: taken in once per issue (its id), never touching the running score */

  /* ---- shot clock: {left: ms, run: bool, t: when left was true}. The display pages count down by themselves from the last message ---- */

  /* ---- drawing: every element marked data-o="key" gets the text for that key (both layouts at once) ---- */
  function put(k, v) { $$('[data-o="' + k + '"]').forEach(function (e) { if (e.textContent !== String(v)) e.textContent = v; }); }
  function show(sel, on) { $$(sel).forEach(function (e) { e.hidden = !on; }); }
  function draw() {
    var c = S.cfg, pk = P(), cur = S.p[S.turn], oth = S.p[S.turn ? 0 : 1];
    $('iMatch').value = match;
    $$('[data-f]').forEach(function (el) { if (document.activeElement === el) return; var f = el.getAttribute('data-f'), v = f === 'title' ? S.title : f.charAt(0) === 'n' ? S.p[+f.charAt(1)].n : (S.p[+f.charAt(1)].h || ''); if (el.value !== String(v)) el.value = v; });
    [0, 1].forEach(function (i) {
      var p = S.p[i]; put('s' + i, p.s); put('x' + i, p.hr); put('v' + i, avg(i)); put('n' + i, p.n);
      $$('[data-o="r' + i + '"]').forEach(function (r) { if (reached(i)) { r.textContent = 'あがり'; r.className = 'rm fin'; } else { r.textContent = p.h > 0 ? 'あと ' + (p.h - p.s) + (pk ? ' セット' : ' 点') : ''; r.className = 'rm'; } });
      put('m' + i, (p.h > 0 ? (pk ? p.h + ' 先取' : '持ち点 ' + p.h) : '') + (c.stats && !pk ? '　HR ' + p.hr : ''));
      $$('[data-pl="' + i + '"]').forEach(function (e) { e.classList.toggle('on', S.turn === i); });
      put('tn' + i, pk ? 'ブレイクにする' : 'この選手の番にする');
      $$('[data-to="' + i + '"]').forEach(function (b) { b.hidden = !(c.to > 0 && c.clk > 0); b.disabled = S.turn !== i || p.to >= c.to || !!S.over; b.textContent = (pk ? 'エクステンション' : 'タイムアウト') + ' 残り' + Math.max(0, c.to - p.to); });
    });
    put('hl', pk ? '先取' : '持ち点'); put('ttl', S.title + (S.round ? '　' + S.round : ''));

    var sr = $('sRound'), known = [].some.call(sr.options, function (o) { return o.value !== '*' && (o.value || o.text) === S.round || (o.value === '' && !S.round); });
    if (S.round && !known) custom = true; sr.value = custom ? '*' : S.round; $('iRound').hidden = !custom; if (custom && document.activeElement !== $('iRound')) $('iRound').value = S.round;
    put('inn', pk ? S.p[0].s + S.p[1].s + 1 : S.inn); put('innl', pk ? 'ラック' : 'イニング');
    put('nxl', pk ? 'ブレイク交代' : (S.rep || (last && S.turn === 1)) ? '交代（試合終了）' : '交代'); put('nxt', pk ? 'いまのブレイク：' + cur.n : '次は ' + oth.n);
    put('plusn', cur.n + ' に1' + (pk ? 'セット' : '点')); $$('[data-o="plus"]').forEach(function (e) { e.classList.toggle('b', S.turn === 1); });

    show('[data-stats]', c.stats && !pk); show('[data-inns]', !pk); show('[data-ck]', !!c.clk);

      $('resT').innerHTML = '<tr><th></th><th>' + (pk ? 'セット' : '得点') + '</th>' + (pk ? '' : '<th>イニング</th><th>アベレージ</th><th>ハイラン</th>') + '</tr>' + [0, 1].map(function (i) { var p = S.p[i]; return '<tr' + (w === i ? ' class="w"' : '') + '><td></td><td>' + p.s + '</td>' + (pk ? '' : '<td>' + inns(i) + '</td><td>' + avg(i) + '</td><td>' + p.hr + '</td>') + '</tr>'; }).join('');

  }
  function tick(force) {
    if (!S.cfg.clk) return; var l = ckLeft(), sec = Math.ceil(l / 1000), run = !!(S.ck && S.ck.run), warn = run && l <= 10000;

    try { w = new WebSocket('wss://' + WSH + '/api/count/' + room(match) + '?role=remote'); } catch (e) { return go(); }

  });

    else if (f.charAt(0) === 'n') S.p[+f.charAt(1)].n = v.slice(0, 16) || (f === 'n0' ? 'PLAYER A' : 'PLAYER B');
