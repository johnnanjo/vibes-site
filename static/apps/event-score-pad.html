<!doctype html>
<html lang="ja" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>イベント用 スコア入力｜VIBES BILLIARDS</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/img/favicon-64.png">
<style>
/* Event scoreboard, input side (tablet in landscape, one screen, no scrolling). Hidden page: opened only by its address.
   ?match=<id> keeps each event's score apart. This page owns the score and sends it to /event-score-obs through the scoreboard relay. */
@font-face{font-family:VLNum;src:url(/fonts/vibes-num.woff2) format("woff2");font-display:swap}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0B192C;color:#fff;font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr);gap:1.2vh;padding:max(1.4vh,env(safe-area-inset-top)) max(1.4vw,env(safe-area-inset-right)) max(1.4vh,env(safe-area-inset-bottom)) max(1.4vw,env(safe-area-inset-left))}
.top{display:flex;align-items:center;gap:1vw;min-height:6.5vh}
.top .mt{display:flex;align-items:center;gap:.6vw;background:#12284A;border-radius:1.2vh;padding:.6vh 1vw;font-weight:800;font-size:2.1vh}
.top .mt small{font-size:1.7vh;color:#B9C4D6}
.top input{font:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;color:#fff;background:#0B192C;border:.2vh solid #2B4A7A;border-radius:.9vh;padding:.7vh .8vw;min-width:0}
#iMatch{width:17vw}#iTitle{width:22vw}
.top .st{margin-left:auto;display:flex;align-items:center;gap:.6vw;font-weight:800;font-size:2vh}.top .st i{width:1.6vh;height:1.6vh;border-radius:50%;background:#7A8699}.top .st.on i{background:#39D98A}
.tb{appearance:none;border:.2vh solid #2B4A7A;background:#12284A;color:#fff;font:800 2.1vh/1 "Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;border-radius:1.2vh;padding:0 1.4vw;min-height:6vh;cursor:pointer}
.tb.dg{border-color:#FF6B6B;color:#FFD1D1}
.main{display:grid;grid-template-columns:minmax(0,1fr) 22vw minmax(0,1fr);gap:1.2vw;min-height:0}
.pl{min-height:0;background:#12284A;border:.7vh solid #12284A;border-radius:3vh;padding:1.6vh 1.4vw;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:1vh}
.pl.on{border-color:#FFD700;box-shadow:0 0 0 .4vh rgba(255,215,0,.25)}
.pl .hd{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.8vw;align-items:center}
.pl .ball{width:4.2vh;height:4.2vh;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff 0 12%,var(--b) 40%);box-shadow:inset -.5vh -.6vh 0 rgba(0,0,0,.18)}
.pl .nm{font:900 3.6vh/1.2 "Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;color:#fff;background:transparent;border:0;border-bottom:.3vh solid #2B4A7A;border-radius:0;padding:.4vh .2vw;width:100%;min-width:0;-webkit-user-select:text;user-select:text}
.pl .hc{display:flex;align-items:center;gap:.4vw;font-weight:800;font-size:1.9vh;color:#B9C4D6;white-space:nowrap}
.pl .hc input{font:900 3vh/1 VLNum,"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;color:#FFD700;background:#0B192C;border:.2vh solid #2B4A7A;border-radius:.9vh;width:7.5vw;padding:.6vh .3vw;text-align:center;-webkit-user-select:text;user-select:text}
.pl .sc{min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4vh}
.pl .sc b{font:400 34vh/.9 VLNum,system-ui,sans-serif;color:#fff;letter-spacing:-.02em}
.pl.b .sc b{color:#FFD700}
.pl .sc span{font-weight:800;font-size:2.2vh;color:#B9C4D6;min-height:2.8vh}
.pl .sc span.fin{color:#0B192C;background:#FFD700;border-radius:999px;padding:.3vh 1.4vw}
.pl .bt{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.4fr);gap:1vw}
.pl .bt button{appearance:none;border:0;cursor:pointer;border-radius:2.2vh;min-height:15vh;font:400 8vh/1 VLNum,system-ui,sans-serif}
.pl .bt .mn{background:#0B192C;color:#fff;box-shadow:inset 0 0 0 .3vh #2B4A7A;font-size:5.4vh}
.pl .bt .pp{background:#fff;color:#0B192C}.pl.b .bt .pp{background:#FFD700}
.pl .bt button:active,.mid button:active,.tb:active{transform:scale(.97)}
.pl .tn{appearance:none;border:.2vh solid #2B4A7A;background:transparent;color:#B9C4D6;font:800 1.8vh/1 "Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;border-radius:999px;padding:.9vh 1vw;cursor:pointer;white-space:nowrap}
.pl.on .tn{background:#FFD700;border-color:#FFD700;color:#0B192C}
.mid{min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:1.2vh}
.inn{background:#12284A;border-radius:3vh;padding:1.6vh 1vw;display:flex;flex-direction:column;align-items:center;gap:.6vh}
.inn small{font-weight:800;font-size:2.2vh;color:#B9C4D6}
.inn b{font:400 15vh/.95 VLNum,system-ui,sans-serif}
.inn div{display:grid;grid-template-columns:1fr 1fr;gap:.8vw;width:100%}
.inn button{appearance:none;border:0;cursor:pointer;border-radius:1.6vh;min-height:8vh;background:#0B192C;color:#fff;box-shadow:inset 0 0 0 .3vh #2B4A7A;font:400 4.4vh/1 VLNum,system-ui,sans-serif}
.nx{appearance:none;border:0;cursor:pointer;border-radius:3vh;background:#FFD700;color:#0B192C;font:900 5.2vh/1.2 "Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6vh;min-height:0}
.nx small{font-size:2vh;font-weight:800}
.hint{font-weight:700;font-size:1.7vh;line-height:1.5;color:#B9C4D6;text-align:center;margin:0}
.dlg{position:fixed;inset:0;background:rgba(5,12,24,.82);display:flex;align-items:center;justify-content:center;z-index:9}
.dlg[hidden]{display:none}
.dlg div{background:#12284A;border:.3vh solid #2B4A7A;border-radius:3vh;padding:4vh 3vw;max-width:70vw;display:flex;flex-direction:column;gap:2.4vh;text-align:center}
.dlg b{font-size:3.4vh;font-weight:900;line-height:1.5}.dlg p{margin:0;font-size:2.2vh;font-weight:700;line-height:1.7;color:#B9C4D6}
.dlg nav{display:grid;grid-template-columns:1fr 1fr;gap:1.4vw}
.dlg button{appearance:none;border:0;cursor:pointer;border-radius:2vh;min-height:10vh;font:900 3vh/1 "Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif}
.dlg .no{background:#0B192C;color:#fff;box-shadow:inset 0 0 0 .3vh #2B4A7A}.dlg .ok{background:#FF6B6B;color:#0B192C}
@media (orientation:portrait){.rot{display:flex}}
.rot{display:none;position:fixed;inset:0;background:#0B192C;z-index:20;align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:5vw;line-height:1.7;padding:8vw}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <label class="mt"><small>試合ID</small><input id="iMatch" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="試合ID"></label>
    <label class="mt"><small>表示名</small><input id="iTitle" autocomplete="off" maxlength="24" aria-label="配信に出すタイトル"></label>
    <div class="st" id="st"><i></i><span id="stT">つないでいます</span></div>
    <button class="tb dg" type="button" id="bReset">リセット</button>
  </div>
  <div class="main">
    <section class="pl a" id="pA"><div class="hd"><span class="ball" style="--b:#E9EEF5"></span><input class="nm" id="nA" maxlength="16" autocomplete="off" aria-label="選手A（白球）の名前"><label class="hc">持ち点<input id="hA" inputmode="numeric" maxlength="3" aria-label="選手Aの持ち点"></label></div>
      <div class="sc"><b id="sA">0</b><span id="rA"></span><button class="tn" type="button" data-turn="0">この選手の番にする</button></div>
      <div class="bt"><button class="mn" type="button" data-add="0,-1" aria-label="選手Aの得点を1点へらす">−1</button><button class="pp" type="button" data-add="0,1" aria-label="選手Aに1点入れる">+1</button></div></section>
    <div class="mid">
      <div class="inn"><small>イニング</small><b id="inn">1</b><div><button type="button" data-inn="-1" aria-label="イニングを1つ戻す">−1</button><button type="button" data-inn="1" aria-label="イニングを1つ進める">+1</button></div></div>
      <button class="nx" type="button" id="bNext">交代<small id="nxT"></small></button>
      <p class="hint">点が入るたびに「+1」。<br>撞き終わったら「交代」。</p>
    </div>
    <section class="pl b" id="pB"><div class="hd"><span class="ball" style="--b:#FFD700"></span><input class="nm" id="nB" maxlength="16" autocomplete="off" aria-label="選手B（黄球）の名前"><label class="hc">持ち点<input id="hB" inputmode="numeric" maxlength="3" aria-label="選手Bの持ち点"></label></div>
      <div class="sc"><b id="sB">0</b><span id="rB"></span><button class="tn" type="button" data-turn="1">この選手の番にする</button></div>
      <div class="bt"><button class="mn" type="button" data-add="1,-1" aria-label="選手Bの得点を1点へらす">−1</button><button class="pp" type="button" data-add="1,1" aria-label="選手Bに1点入れる">+1</button></div></section>
  </div>
</div>
<div class="dlg" id="dlg" hidden><div><b>スコアとイニングを、0に戻しますか？</b><p>選手の名前と持ち点は残ります。配信の画面も、すぐに0になります。</p><nav><button class="no" type="button" id="dNo">やめる</button><button class="ok" type="button" id="dOk">0に戻す</button></nav></div></div>
<div class="rot">タブレットを<br>横向きにしてください</div>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var WSH = /\.workers\.dev$/.test(location.host) ? location.host : 'vibes-site1.quiet-darkness-2185.workers.dev';
  function clean(m) { return String(m || '').toLowerCase().replace(/[^a-z0-9_-]/g, '').slice(0, 40); }
  /* the relay's rooms are 6-digit numbers: the match id is turned into one (same rule on the OBS page) */
  function room(m) { var h = 2166136261; for (var i = 0; i < m.length; i++) { h ^= m.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return String(100000 + (h % 900000)); }
  var match = clean((/[?&]match=([^&#]+)/.exec(location.search) || [])[1] ? decodeURIComponent((/[?&]match=([^&#]+)/.exec(location.search))[1]) : '') || 'test';
  var KEY = 'vibes-event-score:' + match, S = null, ws = null, tries = 0, timer = null, gotRemote = false;
  function blank() { return { type: 'state', v: 1, m: match, title: '3-CUSHION', inn: 1, turn: 0, p: [{ n: 'PLAYER A', h: 0, s: 0 }, { n: 'PLAYER B', h: 0, s: 0 }], t: 0 }; }
  function valid(o) { return o && o.type === 'state' && o.p && o.p.length === 2 && typeof o.inn === 'number'; }
  try { var j = JSON.parse(localStorage.getItem(KEY) || 'null'); if (valid(j)) S = j; } catch (e) {}
  var fresh = !S; if (!S) S = blank();
  function draw() {
    $('iMatch').value = match; if (document.activeElement !== $('iTitle')) $('iTitle').value = S.title;
    [['A', 0], ['B', 1]].forEach(function (x) {
      var p = S.p[x[1]]; if (document.activeElement !== $('n' + x[0])) $('n' + x[0]).value = p.n; if (document.activeElement !== $('h' + x[0])) $('h' + x[0]).value = p.h || '';
      $('s' + x[0]).textContent = p.s; var r = $('r' + x[0]); if (p.h > 0 && p.s >= p.h) { r.textContent = 'あがり'; r.className = 'fin'; } else { r.textContent = p.h > 0 ? 'あと ' + (p.h - p.s) + ' 点' : ''; r.className = ''; }
      $('p' + x[0]).classList.toggle('on', S.turn === x[1]);
    });
    $('inn').textContent = S.inn; $('nxT').textContent = '次は ' + S.p[S.turn ? 0 : 1].n;
  }
  function push() { if (ws && ws.readyState === 1) { try { ws.send(JSON.stringify(S)); } catch (e) {} } }
  function save() { S.t = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} draw(); push(); }
  /* ---- connection: this page is the "display" side of the relay (the side whose state is kept and handed to late joiners) ---- */
  function status(on) { $('st').className = 'st' + (on ? ' on' : ''); $('stT').textContent = on ? '配信の画面とつながっています' : 'つなぎ直しています'; }
  function connect() {
    try { ws = new WebSocket('wss://' + WSH + '/api/count/' + room(match) + '?role=display'); } catch (e) { status(false); return; }
    var ping; ws.onopen = function () { tries = 0; status(true); push(); ping = setInterval(function () { if (ws.readyState === 1) ws.send('ping'); }, 25000); };
    ws.onmessage = function (ev) { if (ev.data === 'pong') return; var m; try { m = JSON.parse(ev.data); } catch (e) { return; } if (m.type === 'hello') push(); };
    ws.onclose = function () { clearInterval(ping); status(false); clearTimeout(timer); timer = setTimeout(connect, Math.min(8000, 500 * Math.pow(2, tries++))); };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  }
  /* a tablet that has never held this match (swapped device, cleared browser) first asks the relay for the last known score */
  function start() {
    if (!fresh) return connect();
    var w, done = false, go = function () { if (done) return; done = true; try { w.close(); } catch (e) {} draw(); connect(); };
    try { w = new WebSocket('wss://' + WSH + '/api/count/' + room(match) + '?role=remote'); } catch (e) { return go(); }
    w.onmessage = function (ev) { var m; try { m = JSON.parse(ev.data); } catch (e) { return; } if (valid(m) && m.m === match) { S = m; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} go(); } };
    w.onerror = go; w.onclose = go; setTimeout(go, 1500);
  }
  /* ---- actions ---- */
  document.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.add) { var a = b.dataset.add.split(','), p = S.p[+a[0]]; p.s = Math.max(0, Math.min(999, p.s + (+a[1]))); save(); }
    else if (b.dataset.inn) { S.inn = Math.max(1, Math.min(999, S.inn + (+b.dataset.inn))); save(); }
    else if (b.dataset.turn) { S.turn = +b.dataset.turn; save(); }
    else if (b.id === 'bNext') { if (S.turn === 0) S.turn = 1; else { S.turn = 0; S.inn = Math.min(999, S.inn + 1); } save(); }
    else if (b.id === 'bReset') $('dlg').hidden = false;
    else if (b.id === 'dNo') $('dlg').hidden = true;
    else if (b.id === 'dOk') { S.p[0].s = 0; S.p[1].s = 0; S.inn = 1; S.turn = 0; $('dlg').hidden = true; save(); }
  });
  function bind(id, fn) { var el = $(id); el.addEventListener('input', function () { fn(el.value); S.t = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} push(); if (/^h/.test(id)) draw(); $('nxT').textContent = '次は ' + S.p[S.turn ? 0 : 1].n; }); el.addEventListener('blur', draw); el.addEventListener('keydown', function (e) { if (e.key === 'Enter') el.blur(); }); }
  bind('nA', function (v) { S.p[0].n = v.slice(0, 16) || 'PLAYER A'; }); bind('nB', function (v) { S.p[1].n = v.slice(0, 16) || 'PLAYER B'; });
  bind('hA', function (v) { S.p[0].h = Math.min(999, parseInt(String(v).replace(/[^0-9]/g, ''), 10) || 0); }); bind('hB', function (v) { S.p[1].h = Math.min(999, parseInt(String(v).replace(/[^0-9]/g, ''), 10) || 0); });
  bind('iTitle', function (v) { S.title = v.slice(0, 24) || '3-CUSHION'; });
  $('iMatch').addEventListener('change', function () { var m = clean($('iMatch').value); if (m && m !== match) location.search = '?match=' + encodeURIComponent(m); else $('iMatch').value = match; });
  $('iMatch').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('iMatch').blur(); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { wake(); if (!ws || ws.readyState > 1) { clearTimeout(timer); connect(); } } });
  window.addEventListener('online', function () { if (!ws || ws.readyState > 1) { clearTimeout(timer); connect(); } });
  var wake = function () { try { if (navigator.wakeLock && document.visibilityState === 'visible') navigator.wakeLock.request('screen').catch(function () {}); } catch (e) {} };
  draw(); wake(); start();
})();
</script>
</body>
</html>
