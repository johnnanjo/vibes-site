<style>
/* layout: one phone-width column. registration, then the three-number entry form, then totals and the game log. */
#c3s{--night:#171A22;--panel:#222631;--panel2:#2B303D;--line:#3A4050;--chalk:#F3F4EF;--dim:#AEB4C0;--lime:#C0FC09;--carom:#1E5AA8;--loss:#FF8A9A;--num:Anton,"Arial Narrow",Impact,sans-serif;color-scheme:dark}
#c3s *{box-sizing:border-box}
#c3s{background:var(--night);color:var(--chalk);font-size:15px;line-height:1.6;margin:0 calc(50% - 50vw);padding:0 calc(50vw - 50%)}
#c3s .wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#c3s h1{font-size:22px;font-weight:900;margin:0;line-height:1.3}
#c3s h2{font-size:16px;font-weight:800;margin:0}
#c3s p{margin:0}
#c3s .sub{color:var(--dim);font-size:13px}
#c3s .card{background:var(--panel);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
#c3s .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#c3s .st{background:var(--panel2);border-radius:12px;padding:10px 8px;text-align:center;min-width:0}
#c3s .st b{display:block;font-family:var(--num);font-weight:400;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
#c3s .st span{font-size:11.5px;color:var(--dim)}
#c3s .st.big{grid-column:1/-1;background:var(--carom)}
#c3s .st.big b{font-size:56px}
#c3s .st.big span{color:#DCE8F8;font-size:13px}
#c3s button{font:inherit;color:inherit;border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer;background:var(--panel2)}
#c3s button:focus-visible,#c3s input:focus-visible,#c3s select:focus-visible,#c3s summary:focus-visible,#c3s a:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
#c3s button.pri{background:var(--lime);color:var(--night);font-size:17px;padding:15px}
#c3s button.ghost{background:transparent;border:1.5px solid var(--line)}
#c3s button.danger{background:transparent;border:1.5px solid var(--loss);color:var(--loss);padding:8px 12px;font-size:13px}
#c3s button:disabled{opacity:.45;cursor:default}
#c3s .row{display:flex;gap:8px;flex-wrap:wrap;border:0;padding:0;margin:0}
#c3s .row>*{flex:1 1 140px}
#c3s .note{background:var(--panel2);border-left:4px solid #D8C24A;border-radius:8px;padding:10px 12px;font-size:13px}
#c3s .err{border-left-color:var(--loss)}
#c3s label{font-size:12.5px;color:var(--dim);display:flex;flex-direction:column;gap:4px;min-width:0}
#c3s input,#c3s select{font:inherit;color:var(--chalk);background:var(--night);border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
/* the three numbers */
#c3s .three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
#c3s .three label{font-size:13px;color:var(--chalk);font-weight:800;text-align:center}
#c3s .three input{font-family:var(--num);font-size:34px;text-align:center;padding:10px 2px;font-variant-numeric:tabular-nums}
#c3s .three small{font-weight:500;color:var(--dim);font-size:11px}
#c3s .live{background:var(--carom);border-radius:12px;padding:10px 14px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
#c3s .live span{color:#DCE8F8;font-size:13px}
#c3s .live b{font-family:var(--num);font-weight:400;font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
/* log */
#c3s .game{background:var(--panel);border-radius:14px;overflow:hidden}
#c3s .game summary{list-style:none;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:12px 14px;cursor:pointer}
#c3s .game summary::-webkit-details-marker{display:none}
#c3s .pill{font-size:12px;font-weight:900;border-radius:999px;padding:3px 10px;white-space:nowrap}
#c3s .pill.w{background:var(--lime);color:var(--night)}
#c3s .pill.l{background:var(--panel2);color:var(--loss)}
#c3s .pill.d,#c3s .pill.n{background:var(--panel2);color:var(--dim)}
#c3s .game .sc{font-family:var(--num);font-size:22px;line-height:1.15}
#c3s .game .meta{font-size:12px;color:var(--dim);overflow-wrap:anywhere}
#c3s .game .avg{font-family:var(--num);font-size:24px;text-align:right}
#c3s .game .avg small{display:block;font-family:inherit;font-size:11px;color:var(--dim)}
#c3s .game .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
#c3s svg text{font-family:inherit}
</style>
<div id="c3s">
<div class="wrap">
  <header>
    <h1>3C 自己データ帳</h1>
    <p class="sub">スリークッションのゲームごとに「得点・イニング・ハイラン」を入れると、アベレージを計算して自分の成績にためていきます。無料。登録の内容も記録も、この端末の中だけに保存します。<a href="/pages/3c-self-data-guide" style="color:inherit;font-weight:700">使い方を図で見る</a></p>
  </header>

  <section class="card" id="prof" aria-labelledby="h-prof">
    <h2 id="h-prof">ユーザー登録</h2>
    <div id="profView" hidden>
      <div class="row" style="align-items:center"><p style="flex:3 1 180px"><b id="pvName"></b><br><span class="sub">持ち点 <b id="pvH" style="font-size:18px;color:var(--chalk)"></b> 点</span></p><button class="ghost" id="btnProfEdit" type="button" style="flex:1 1 110px;padding:9px 12px;font-size:14px">変更する</button></div>
    </div>
    <div id="profForm" hidden>
      <p class="sub" id="profLead">はじめに、自分の持ち点を登録してください。持ち点に届いたゲームを「あがり」として数えるのに使います。持ち点が変わったら、あとから直せます。</p>
      <div class="row" style="margin-top:10px">
        <label>自分の持ち点（必ず入れる）<input id="pfH" type="number" inputmode="numeric" min="1" max="99" placeholder="例：20"></label>
        <label>ニックネーム（なくてもよい）<input id="pfName" type="text" maxlength="20" autocomplete="off" placeholder="例：ビリ太郎"></label>
      </div>
      <p class="note err" id="profErr" hidden style="margin-top:10px"></p>
      <div class="row" style="margin-top:10px"><button class="pri" id="btnProfSave" type="button" style="font-size:16px;padding:13px">登録する</button><button class="ghost" id="btnProfCancel" type="button" hidden>やめる</button></div>
    </div>
  </section>

  <section class="card" id="entry" aria-labelledby="h-entry">
    <h2 id="h-entry">ゲームを記録する</h2>
    <p class="note" id="needNote" hidden>先に、上の「ユーザー登録」で自分の持ち点を登録してください。</p>
    <div class="three">
      <label>得点<input id="fPts" type="number" inputmode="numeric" min="0" max="999" placeholder="0"><small>取った点数</small></label>
      <label>イニング<input id="fInn" type="number" inputmode="numeric" min="1" max="999" placeholder="0"><small>撞いた回数</small></label>
      <label>ハイラン<input id="fHr" type="number" inputmode="numeric" min="0" max="99" placeholder="0"><small>1回の最高得点</small></label>
    </div>
    <div class="live"><span>このゲームのアベレージ（得点 ÷ イニング）</span><b id="liveAvg">—</b></div>
    <div class="row">
      <label>日付<input id="fDate" type="date"></label>
      <label>結果<select id="fRes"><option value="auto">自動（持ち点に届いたら勝ち）</option><option value="w">勝ち</option><option value="l">負け</option><option value="d">引き分け</option><option value="n">つけない（練習など）</option></select></label>
    </div>
    <div class="row">
      <label>このゲームの持ち点<input id="fH" type="number" inputmode="numeric" min="1" max="99"></label>
      <label>メモ（相手・お店など。なくてもよい）<input id="fMemo" type="text" maxlength="60" autocomplete="off"></label>
    </div>
    <p class="note err" id="saveErr" hidden></p>
    <button class="pri" id="btnSave" type="button">このゲームを保存する</button>
  </section>

  <section class="card" aria-labelledby="h-sum">
    <h2 id="h-sum">通算成績</h2>
    <div class="stats" id="stats"></div>
    <div id="chart"></div>
    <p class="sub" id="sumNote"></p>
  </section>

  <section aria-labelledby="h-log" style="display:flex;flex-direction:column;gap:10px">
    <h2 id="h-log">ゲームの記録</h2>
    <div id="log" style="display:flex;flex-direction:column;gap:8px"></div>
  </section>
</div>
</div>
<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var games=[],prof=null,KEY="vibes-3c-self-v1",PKEY="vibes-3c-self-profile";
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function f3(n,d){return d>0?(Math.floor(n*1000/d)/1000).toFixed(3):"—"}
function int(v){var n=parseInt(v,10);return isFinite(n)?n:NaN}
/* older records kept the score of every inning; fold them into the three numbers */
function norm(g){if(!g||typeof g!=="object")return null;
  if(Array.isArray(g.me)){var m=g.me.filter(function(v){return typeof v==="number"&&isFinite(v)});g={id:g.id,d:g.d,ts:g.ts,pts:m.reduce(function(a,b){return a+b},0),inn:m.length,hr:m.length?Math.max.apply(null,m):0,h:g.hm|0,res:g.res,memo:g.memo||g.opn||""}}
  if(!(g.inn>0)||!(g.pts>=0))return null;
  return{id:String(g.id||("g"+Math.random().toString(36).slice(2))),d:String(g.d||""),ts:+g.ts||0,pts:g.pts|0,inn:g.inn|0,hr:g.hr|0,h:g.h|0,res:g.res||"auto",memo:String(g.memo||"").slice(0,60)}}
function load(){try{var a=JSON.parse(localStorage.getItem(KEY)||"[]");games=(Array.isArray(a)?a:[]).map(norm).filter(Boolean)}catch(e){games=[]}
  games.sort(function(x,y){return (y.d||"").localeCompare(x.d||"")||(y.ts-x.ts)})}
function store(){try{localStorage.setItem(KEY,JSON.stringify(games));return true}catch(e){return false}}
function resOf(g){if(g.res&&g.res!=="auto")return g.res;return g.h>0&&g.pts>=g.h?"w":"n"}
var RES={w:"勝ち",l:"負け",d:"引き分け",n:"記録"};

/* ---------- 通算 ---------- */
function renderStats(){
  var tp=0,ti=0,hr=0,w=0,l=0,best=null;
  games.forEach(function(g){tp+=g.pts;ti+=g.inn;hr=Math.max(hr,g.hr);var r=resOf(g);if(r==="w")w++;if(r==="l")l++;var a=g.pts/g.inn;if(best===null||a>best)best=a});
  var last=games.slice(0,5),lp=0,li=0;last.forEach(function(g){lp+=g.pts;li+=g.inn});
  var cells=[["big",f3(tp,ti),"通算アベレージ（総得点 ÷ 総イニング）"],["",games.length,"ゲーム数"],["",games.length?f3(lp,li):"—","直近5ゲーム"],["",best===null?"—":(Math.floor(best*1000)/1000).toFixed(3),"ベストゲーム"],
    ["",hr||"—","ハイラン"],["",tp,"総得点"],["",ti,"総イニング"]];
  $("stats").innerHTML=cells.map(function(c){return '<div class="st '+c[0]+'"><b>'+esc(c[1])+'</b><span>'+c[2]+'</span></div>'}).join("");
  $("sumNote").textContent=games.length?("勝ち "+w+"・負け "+l+"（結果をつけたゲームだけ数えています）"):"まだ記録がありません。上の3つの数字を入れて、最初のゲームを保存してください。";
  renderChart();
}
function renderChart(){
  var el=$("chart"),list=games.slice(0,30).reverse();
  if(list.length<2){el.innerHTML="";return}
  var W=520,H=150,L=34,R=8,T=10,B=22,vals=list.map(function(g){return g.pts/g.inn});
  var max=Math.max.apply(null,vals),top=Math.max(0.5,Math.ceil(max*2)/2),iw=(W-L-R)/list.length,bw=Math.min(26,iw*0.7);
  var y=function(v){return T+(H-T-B)*(1-v/top)};
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="ゲームごとのアベレージの推移" style="width:100%;height:auto;display:block">';
  [0,top/2,top].forEach(function(v){s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="#3A4050" stroke-width="1"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end" font-size="11" fill="#AEB4C0">'+v.toFixed(2)+'</text>'});
  vals.forEach(function(v,i){var x=L+iw*i+(iw-bw)/2,last=i===vals.length-1;s+='<rect x="'+x.toFixed(1)+'" y="'+y(v).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(1,y(0)-y(v)).toFixed(1)+'" rx="3" fill="'+(last?"#C0FC09":"#1E5AA8")+'"/>'});
  s+='<text x="'+L+'" y="'+(H-5)+'" font-size="11" fill="#AEB4C0">'+esc(list[0].d)+'</text><text x="'+(W-R)+'" y="'+(H-5)+'" text-anchor="end" font-size="11" fill="#AEB4C0">'+esc(list[list.length-1].d)+'（最新）</text></svg>';
  el.innerHTML=s+'<p class="sub">ゲームごとのアベレージ（古い順・直近30ゲーム。ライムがいちばん新しいゲーム）</p>';
}

/* ---------- 記録の一覧 ---------- */
function renderLog(){
  var el=$("log");
  if(!games.length){el.innerHTML='<p class="sub">保存したゲームがここに新しい順で並びます。</p>';return}
  el.innerHTML=games.map(function(g){var r=resOf(g);
    return '<details class="game"><summary><span class="pill '+r+'">'+RES[r]+'</span><span><span class="sc">'+g.pts+'点 ／ '+g.inn+'イニング</span><span class="meta"><br>'+esc(g.d)+'・ハイラン '+g.hr+(g.h?'・持ち点 '+g.h:'')+'</span></span><span class="avg">'+f3(g.pts,g.inn)+'<small>アベレージ</small></span></summary>'+
      '<div class="body">'+(g.memo?'<p class="sub">メモ：'+esc(g.memo)+'</p>':'')+'<div class="row" data-id="'+esc(g.id)+'"><button class="danger" type="button" data-act="ask">この記録を消す</button></div></div></details>';
  }).join("");
}
$("log").addEventListener("click",function(e){
  var b=e.target.closest("button[data-act]");if(!b)return;var box=b.parentNode,id=box.getAttribute("data-id");
  if(b.dataset.act==="ask"){box.innerHTML='<button class="danger" type="button" data-act="yes">本当に消す（元に戻せません）</button><button class="ghost" type="button" data-act="no" style="padding:8px 12px;font-size:13px">やめる</button>'}
  else if(b.dataset.act==="no"){box.innerHTML='<button class="danger" type="button" data-act="ask">この記録を消す</button>'}
  else if(b.dataset.act==="yes"){games=games.filter(function(g){return g.id!==id});store();renderStats();renderLog()}
});

/* ---------- 入力 ---------- */
function live(){var p=int($("fPts").value),i=int($("fInn").value);$("liveAvg").textContent=(p>=0&&i>0)?f3(p,i):"—"}
["fPts","fInn","fHr"].forEach(function(id){$(id).addEventListener("input",live)});
function resetForm(){["fPts","fInn","fHr","fMemo"].forEach(function(id){$(id).value=""});$("fDate").value=today();$("fRes").value="auto";$("fH").value=prof?prof.h:"";$("saveErr").hidden=true;live()}
function gate(){var ok=!!prof;$("needNote").hidden=ok;Array.prototype.forEach.call($("entry").querySelectorAll("input,select,button"),function(x){x.disabled=!ok})}
$("btnSave").onclick=function(){
  var er=$("saveErr"),p=int($("fPts").value),i=int($("fInn").value),h=int($("fHr").value),m="";
  if(!(p>=0))m="得点を入れてください（0点なら 0）。";
  else if(!(i>=1))m="イニングを 1 以上の数字で入れてください。";
  else if(!(h>=0))m="ハイランを入れてください（0点のゲームなら 0）。";
  else if(h>p)m="ハイラン（"+h+"）が得点（"+p+"）より大きくなっています。数字を確かめてください。";
  else if(p>0&&h<1)m="得点があるゲームのハイランは 1 以上です。数字を確かめてください。";
  else if(h*i<p)m="ハイラン "+h+" で "+i+" イニングだと、最大でも "+(h*i)+" 点です。得点（"+p+"）かイニングを確かめてください。";
  if(m){er.textContent=m;er.hidden=false;return}
  var g={id:"g"+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36),d:$("fDate").value||today(),ts:Date.now(),pts:p,inn:i,hr:h,h:int($("fH").value)>0?int($("fH").value):(prof?prof.h:0),res:$("fRes").value,memo:$("fMemo").value.trim().slice(0,60)};
  games.unshift(g);
  if(!store()){games.shift();er.textContent="この端末に保存できませんでした。プライベートブラウズ（シークレット）を切るか、空き容量を確かめてください。";er.hidden=false;return}
  load();resetForm();renderStats();renderLog();$("h-sum").scrollIntoView({block:"start",behavior:"smooth"});
};

/* ---------- ユーザー登録 ---------- */
function showProf(edit){var has=!!prof;$("profView").hidden=!has||edit;$("profForm").hidden=has&&!edit;$("btnProfCancel").hidden=!has;
  $("h-prof").textContent=has&&!edit?"登録している内容":"ユーザー登録";
  if(has){$("pvName").textContent=prof.name?prof.name+" さん":"ニックネームなし";$("pvH").textContent=prof.h;$("pfH").value=prof.h;$("pfName").value=prof.name||"";
    $("profLead").textContent="持ち点が変わったときは、ここで直してください。これまでのゲームの記録は、そのときの持ち点のまま残ります。"}
  $("h-sum").textContent=(has&&prof.name?prof.name+" さんの":"")+"通算成績";}
$("btnProfEdit").onclick=function(){showProf(true)};$("btnProfCancel").onclick=function(){$("profErr").hidden=true;showProf(false)};
$("btnProfSave").onclick=function(){var h=int($("pfH").value),er=$("profErr");
  if(!(h>=1&&h<=99)){er.textContent="持ち点を 1〜99 の数字で入れてください。";er.hidden=false;$("pfH").focus();return}
  var p={h:h,name:$("pfName").value.trim().slice(0,20),ts:Date.now()};
  try{localStorage.setItem(PKEY,JSON.stringify(p))}catch(e){er.textContent="この端末に保存できませんでした。プライベートブラウズ（シークレット）を切ってから、もう一度ためしてください。";er.hidden=false;return}
  er.hidden=true;prof=p;showProf(false);gate();$("fH").value=p.h;};
try{var pp=JSON.parse(localStorage.getItem(PKEY)||"null");if(pp&&pp.h>=1&&pp.h<=99)prof={h:pp.h|0,name:String(pp.name||"").slice(0,20)}}catch(e){}
load();showProf(false);resetForm();gate();renderStats();renderLog();
})();
</script>
