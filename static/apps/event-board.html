<!doctype html>
<html lang="ja" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>リーグ表・トーナメント表（配信・会場用）｜VIBES DIGITAL LAB</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/img/favicon-64.png">
<style>
/* Standings and bracket for the stream (an OBS browser source at 1920x1080) or a screen in the room.
   Read-only: the organiser's panel (digital-lab-admin, tab 4) sends the whole picture through the scoreboard relay; this page only draws it.
   ?match=<id>  &view=bracket|league (default: the bracket once it exists, the groups before that)  &bg=0 for a see-through background. */
@font-face{font-family:VLNum;src:url(/fonts/vibes-num.woff2) format("woff2");font-display:swap}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#0B192C;color:#fff;font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;font-weight:900}
body.clear,body.clear html{background:transparent}
#pg{height:100%;display:flex;flex-direction:column;gap:1.4vh;padding:2.2vh 1.6vw 2vh}
.hd{display:flex;align-items:center;gap:1.4vw;min-height:7vh}
.hd .t{flex:1;min-width:0;display:flex;flex-direction:column}
.hd .t b{font-size:3.6vh;line-height:1.25;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .t small{font-size:1.7vh;color:#B9C4D6;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .v{flex:none;background:#FFD700;color:#0B192C;border-radius:1.2vh;padding:.6vh 1.6vw;font-size:2.8vh;white-space:nowrap}
.hd .ch{flex:none;border:.4vh solid #FFD700;border-radius:1.2vh;padding:.4vh 1.4vw;font-size:2.6vh;white-space:nowrap}.hd .ch small{font-size:1.6vh;color:#FFD700;margin-right:.8vw}
/* bracket: one column per round; boxes spread evenly, so each sits between the two it comes from */
#bk{flex:1;min-height:0;display:flex;gap:1vw}
.rd{flex:1;min-width:0;display:flex;flex-direction:column;gap:.6vh}
.rd h3{margin:0;text-align:center;font-size:1.9vh;color:#0B192C;background:#B9C4D6;border-radius:.8vh;padding:.3vh 0;flex:none}
.rd .ms{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-around;gap:.4vh}
.m{background:#12284A;border-radius:.9vh;overflow:hidden;border-left:.5vh solid #2B4A7A;display:flex;flex-direction:column;min-height:0;flex:0 1 auto}
.m.on{border-left-color:#E11D48}.m.dn{border-left-color:#39D98A}
.m div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.6vw;align-items:center;padding:0 .6vw;height:var(--rh,2.7vh);font-size:var(--fs,1.8vh);line-height:1}
.m div+div{border-top:1px solid #0B192C}
.m span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m i{font:400 var(--ns,2vh)/1 VLNum,system-ui,sans-serif;font-style:normal}
.m .w{background:#FFD700;color:#0B192C}
.m .x{color:#7A8699}
.m .tb{font:900 1.3vh/1 "Hiragino Sans","Noto Sans JP",sans-serif;color:#fff;background:#E11D48;border-radius:.5vh;padding:.3vh .5vw}
/* groups */
#lg{flex:1;min-height:0;display:grid;gap:1.6vh 1vw;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));align-content:start}
.g{background:#12284A;border-radius:1.4vh;padding:1vh .6vw;display:flex;flex-direction:column;gap:.4vh;min-width:0}
.g h3{margin:0;font-size:2.2vh;color:#FFD700}
.g table{width:100%;border-collapse:collapse}
.g th{font-size:1.25vh;color:#B9C4D6;font-weight:800;text-align:right;padding:.2vh .35vw;white-space:nowrap}.g th:nth-child(2){text-align:left}
.g td{font:400 var(--gn,2.2vh)/1.15 VLNum,system-ui,sans-serif;text-align:right;padding:.7vh .28vw;border-top:.2vh solid #1D3557;white-space:nowrap}
.g td:nth-child(2){font:900 var(--gf,2vh)/1.25 "Hiragino Sans","Noto Sans JP",sans-serif;text-align:left;overflow:hidden;text-overflow:ellipsis;max-width:0;width:100%}
.g td:first-child{color:#FFD700}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:2.6vh;line-height:1.8;color:#B9C4D6;padding:4vh 6vw}
</style>
</head>
<body>
<div id="pg" hidden>
  <div class="hd"><div class="t"><b id="tt"></b><small id="ts" hidden></small></div><span class="ch" id="ch" hidden><small>優勝</small><span id="chn"></span></span><span class="v" id="vw"></span></div>
  <div id="bk" hidden></div>
  <div id="lg" hidden></div>
</div>
<div id="msg">本部の管理者画面（④ 組分け・対戦表）をひらくと、ここに表が出ます。</div>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); }, q = location.search;
  var WSH = /\.workers\.dev$/.test(location.host) ? location.host : 'vibes-site1.quiet-darkness-2185.workers.dev';
  function clean(m) { return String(m || '').toLowerCase().replace(/[^a-z0-9_-]/g, '').slice(0, 40); }
  function room(m) { var h = 2166136261; for (var i = 0; i < m.length; i++) { h ^= m.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return String(100000 + (h % 900000)); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var mm = /[?&]match=([^&#]+)/.exec(q), match = clean(mm ? decodeURIComponent(mm[1]) : ''), view = (/[?&]view=(bracket|league)/.exec(q) || [])[1] || 'auto';
  if (/[?&]bg=0/.test(q)) document.body.classList.add('clear');
  var KEY = 'vibes-event-board:' + match, ws = null, tries = 0, timer = null, last = 0;
  function draw(d) {
    if (!d || d.type !== 'state' || !d.board) return;
    var tp = String(d.title || '').split('｜'); $('tt').textContent = tp[0]; $('ts').textContent = tp[1] || ''; $('ts').hidden = !tp[1];
    var bk = view === 'bracket' || (view === 'auto' && d.rounds && d.rounds.length);
    $('bk').hidden = !bk; $('lg').hidden = !!bk; $('vw').textContent = bk ? '決勝シングルトーナメント' : 'ゼッケン決定戦　リーグ表';
    $('ch').hidden = !(bk && d.champ); $('chn').textContent = d.champ || '';
    if (bk) {
      var R = d.rounds || [], n0 = R.length ? R[0].ms.length : 1, rh = Math.max(1.5, Math.min(3.4, 76 / (n0 * 2.25)));
      $('bk').style.setProperty('--rh', rh + 'vh'); $('bk').style.setProperty('--fs', Math.min(2.2, rh * .68) + 'vh'); $('bk').style.setProperty('--ns', Math.min(2.4, rh * .78) + 'vh');
      $('bk').innerHTML = R.length ? R.map(function (r) {
        return '<div class="rd"><h3>' + esc(r.name) + '</h3><div class="ms">' + r.ms.map(function (m) {
          if (m.bye) return '<div class="m dn"><div><span>' + esc(m.a || m.b) + '</span><i></i></div><div class="x"><span>不戦勝</span><i></i></div></div>';
          var done = m.w === 0 || m.w === 1, row = function (n, s, win) { return '<div' + (win ? ' class="w"' : n ? '' : ' class="x"') + '><span>' + (n ? esc(n) : '—') + '</span><i>' + (done ? s : '') + '</i></div>'; };
          return '<div class="m' + (done ? ' dn' : m.t ? ' on' : '') + '">' + row(m.a, m.sa, m.w === 0) + (m.t && !done ? '<div style="height:auto;padding:.2vh .6vw"><span class="tb" style="justify-self:start">' + m.t + '番台で試合中</span><i></i></div>' : '') + row(m.b, m.sb, m.w === 1) + '</div>';
        }).join('') + '</div></div>';
      }).join('') : '';
    } else {
      var G = d.groups || [], cols = G.length <= 3 ? Math.max(1, G.length) : G.length <= 8 ? 4 : 5, rows = Math.ceil(G.length / cols) || 1, mx = G.reduce(function (a, g) { return Math.max(a, g.rows.length); }, 3);
      var per = 82 / rows / (mx + 1.6); $('lg').style.setProperty('--cols', cols); var cap = cols >= 5 ? 1.9 : cols === 4 ? 2.3 : 2.9; $('lg').style.setProperty('--gn', Math.min(cap, per * .62) + 'vh'); $('lg').style.setProperty('--gf', Math.min(cap * .84, per * .56) + 'vh');
      $('lg').innerHTML = G.map(function (g) {
        return '<div class="g"><h3>' + esc(g.name) + '組</h3><table><tr><th></th><th>選手</th><th>勝</th><th>分</th><th>負</th><th>勝ち点</th><th>AVG</th><th>HR</th></tr>' + g.rows.map(function (r) { return '<tr><td>' + r.rk + '</td><td>' + esc(r.n) + '</td><td>' + r.w + '</td><td>' + r.d + '</td><td>' + r.l + '</td><td>' + r.pts + '</td><td>' + esc(r.avg) + '</td><td>' + r.hr + '</td></tr>'; }).join('') + '</table></div>';
      }).join('');
    }
    $('pg').hidden = false; $('msg').hidden = true; try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {}
    /* inside the stream overlay: tell it there is a table worth showing */
    if (window.parent !== window && ((d.groups && d.groups.length) || (d.rounds && d.rounds.length))) { try { window.parent.postMessage({ vibesBoard: 1 }, location.origin); } catch (e) {} }
  }
  function connect() {
    try { ws = new WebSocket('wss://' + WSH + '/api/count/' + room(match + '-board') + '?role=remote'); } catch (e) { return; }
    var ping; ws.onopen = function () { tries = 0; last = Date.now(); ping = setInterval(function () { if (ws.readyState === 1) ws.send('ping'); if (Date.now() - last > 70000) { try { ws.close(); } catch (e) {} } }, 25000); };
    ws.onmessage = function (ev) { last = Date.now(); if (ev.data === 'pong') return; var m; try { m = JSON.parse(ev.data); } catch (e) { return; } draw(m); };
    ws.onclose = function () { clearInterval(ping); clearTimeout(timer); timer = setTimeout(connect, Math.min(8000, 500 * Math.pow(2, tries++))); };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  }
  if (!match) { $('msg').textContent = 'アドレスの最後に、試合IDを付けて開いてください。例：/event-board?match=w3c-1205'; return; }
  try { var j = JSON.parse(localStorage.getItem(KEY) || 'null'); if (j) draw(j); } catch (e) {}
  connect(); window.addEventListener('online', function () { if (!ws || ws.readyState > 1) { clearTimeout(timer); connect(); } });
})();
</script>
</body>
</html>
