<!doctype html>
<html lang="ja" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>スコア表示｜VIBES DIGITAL LAB</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/img/favicon-64.png">
<link rel="stylesheet" href="/css/queen-cup.css">
<style>
/* Event scoreboard, showing side (no controls). ?match=<id> the same id as /event-score-pad.
   Default: one wide band across the top of the picture for OBS (browser source 1920x1080, transparent ground).  ?pos=bl band at the bottom.
   ?layout=monitor the whole screen for a monitor in the room (dark ground, very large figures).  ?layout=card the earlier small card (corners: ?pos=tr|bl|br).
   ?scale=1.2 bigger or smaller   ?bg=1 dark ground for checking   ?sponsor=0 no sponsors   ?result=0 no result panel at the end of a match */
@font-face{font-family:VLNum;src:url(/fonts/vibes-num.woff2) format("woff2");font-display:swap}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:transparent;overflow:hidden;font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif}
body.bg{background:#22303F}
#card{position:fixed;left:40px;top:40px;transform-origin:0 0;width:620px;border-radius:14px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.45);display:grid;grid-template-columns:118px minmax(0,1fr);grid-template-rows:auto auto auto auto}
.hd{grid-column:1/-1;background:#0B192C;color:#fff;font-weight:900;font-size:22px;letter-spacing:.06em;padding:9px 12px 9px 18px;line-height:1.3;display:flex;align-items:center;gap:12px}
.hd .tw{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}.hd #tt,.hd #ts{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hd #ts{font-size:13px;font-weight:800;letter-spacing:.02em;color:#B9C4D6;line-height:1.3}
.hd #rd{flex:none;background:#FFD700;color:#000;font-size:20px;letter-spacing:.04em;border-radius:8px;padding:3px 12px;line-height:1.35;white-space:nowrap}
.in{grid-row:2/4;background:#0B192C;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-top:2px solid #1D3557}
.in small{font-weight:900;font-size:19px;letter-spacing:.14em;white-space:nowrap}.in b{font:400 54px/1 VLNum,system-ui,sans-serif}
.in em{font-style:normal;font-weight:900;font-size:13px;line-height:1.2;color:#0B192C;background:#FFD700;border-radius:6px;padding:3px 8px;white-space:nowrap}
.in .ic{display:flex;flex-direction:column;align-items:center;gap:3px}.in .iv{display:flex;align-items:baseline;gap:6px;white-space:nowrap}.in #of{font:400 24px/1 VLNum,system-ui,sans-serif;color:#B9C4D6}
.ck{display:none;background:#0B192C;color:#38BDF8;border-left:2px solid #1D3557;align-items:center;justify-content:center;padding:0 18px;font:400 52px/1 VLNum,system-ui,sans-serif;min-width:96px}
.ck.warn{color:#FF6B6B;animation:bl .5s steps(2) infinite}.ck.stop{opacity:.55}
@keyframes bl{50%{opacity:.25}}
.rw{display:grid;grid-template-columns:14px minmax(0,1fr) auto auto auto auto;align-items:center;gap:10px;padding:0 18px 0 0;min-height:66px;color:#000}
.rw.a{background:#fff}.rw.b{background:#FFD700}
.rw i{align-self:stretch;background:transparent}.rw.on i{background:#E11D48}
.rw .n{font-weight:900;font-size:27px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw .h{font-weight:800;font-size:17px;opacity:.6;white-space:nowrap}
.rw .x{font-weight:900;font-size:15px;letter-spacing:.06em;white-space:nowrap;background:rgba(0,0,0,.1);border-radius:8px;padding:5px 9px;line-height:1}.rw .x b{font:400 22px/1 VLNum,system-ui,sans-serif;margin-left:6px}
.rw .o{display:flex;gap:4px}.rw .o u{width:11px;height:16px;border-radius:3px;background:#0B192C;text-decoration:none}.rw .o u.used{opacity:.18}
.rw .s{font:400 50px/1 VLNum,system-ui,sans-serif;min-width:64px;text-align:right}
.rw .d{display:inline-block;width:12px;height:12px;border-radius:50%;background:#E11D48;margin-right:8px;vertical-align:3px;visibility:hidden}.rw.on .d{visibility:visible}
.sp{grid-column:1/-1;background:#0B192C;border-top:2px solid #1D3557;display:flex;align-items:center;gap:12px;padding:10px 18px}
.sp small{color:#fff;font-weight:900;font-size:16px;letter-spacing:.1em;white-space:nowrap;margin-right:4px}
.sp img{display:block;height:64px;width:auto;border-radius:6px;background:#fff}
/* whose turn: the player at the table keeps full colour inside a thick red frame with a red arrow; the other side is dimmed */
.rw{position:relative}
.rw::after{content:"";position:absolute;inset:0;pointer-events:none}
#card.turn .rw:not(.on)::after{background:rgba(11,25,44,.48)}
.rw.on::after{box-shadow:inset 0 0 0 5px #E11D48}
.rw.on i{background:#E11D48}
.rw .d{width:0;height:0;border-radius:0;background:transparent;border-style:solid;border-width:10px 0 10px 16px;border-color:transparent transparent transparent #E11D48;vertical-align:1px;margin-right:10px}
body.mon .rw .d{width:0;height:0;border-width:2.2vh 0 2.2vh 3.4vh;margin-right:1.2vw;vertical-align:.4vh}
body.mon .rw.on::after{box-shadow:none}body.mon .rw::after{border-radius:2vh}
/* wide band */
body.bar #card{left:0;top:0;width:100vw;border-radius:0;display:flex;align-items:stretch;height:84px;box-shadow:0 6px 18px rgba(0,0,0,.4)}
body.bar .hd{flex:0 1 auto;min-width:0;padding:0 20px 0 24px;font-size:26px;gap:14px}
body.bar .hd .tw{flex:0 1 auto}body.bar .hd #ts{font-size:14px}
body.bar .hd #rd{font-size:22px;padding:4px 14px}
body.bar .in{flex:none;flex-direction:row;align-items:center;gap:12px;padding:0 22px;border-top:0;border-left:2px solid #1D3557}
body.bar .in small{font-size:20px}body.bar .in b{font-size:50px}body.bar .in em{font-size:14px;padding:2px 10px;line-height:1.3}body.bar .in #of{font-size:30px}body.bar .in .ic:has(em:not([hidden])) b{font-size:40px}body.bar .in .ic:has(em:not([hidden])) #of{font-size:24px}
body.bar .ck.use{display:flex;flex:none}
body.bar .rw{flex:1 1 0;min-width:0;min-height:0;padding-right:20px}
body.bar .rw .n{font-size:30px}body.bar .rw .s{font-size:56px;min-width:70px}
body.bar .sp{flex:none;border-top:0;padding:0 20px;gap:10px}
body.bar .sp img{height:66px}
/* whole screen for a monitor in the room */
body.mon{background:#060D18}
body.mon #card{left:0;top:0;width:100vw;height:100vh;border-radius:0;box-shadow:none;display:grid;grid-template-columns:minmax(0,1fr) 20vw minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;background:#060D18;gap:1.4vh 1vw;padding:1.6vh 1.2vw}
body.mon .hd{grid-column:1/-1;background:transparent;font-size:5vh;padding:.4vh 1vw;gap:1.4vw}
body.mon .hd #ts{font-size:2.4vh}body.mon .hd .tw{flex-direction:row;align-items:baseline;gap:1.4vw}body.mon .hd #tt{flex:none}
body.mon .hd #rd{font-size:4vh;padding:.6vh 1.6vw;border-radius:1.2vh}
body.mon .in{grid-column:2;grid-row:2;background:#0B192C;border:0;border-radius:3vh;gap:1vh;padding:1vh}
body.mon .in small{font-size:3.4vh}body.mon .in b{font-size:19vh}body.mon .in em{font-size:3.6vh;border-radius:1vh;padding:.6vh 1.2vw}body.mon .in #of{font-size:6vh}body.mon .in .iv{flex-direction:column;align-items:center;gap:0}
body.mon .ck.use{display:flex;grid-column:2;grid-row:2;align-self:end;justify-self:stretch;border:0;border-radius:0 0 3vh 3vh;background:#12284A;font-size:13vh;padding:1.4vh 0;min-width:0}
body.mon #card.hasck .in{padding-bottom:20vh}
body.mon .rw{grid-row:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2vh;padding:2vh 1vw;border-radius:3vh;border:1vh solid transparent;min-width:0}
body.mon .rw.a{grid-column:1}body.mon .rw.b{grid-column:3}
body.mon .rw.on{border-color:#E11D48}
body.mon .rw i{display:none}
body.mon .rw .n{font-size:7.4vh;max-width:100%;order:1}
body.mon .rw .d{width:2.4vh;height:2.4vh;margin-right:1.2vw;vertical-align:.8vh}
body.mon .rw .s{font-size:44vh;line-height:.9;min-width:0;text-align:center;order:2}
body.mon .rw .h{font-size:4vh;order:3;opacity:.7}
body.mon .rw .x{font-size:3vh;padding:1vh 1.4vw;border-radius:1.4vh;order:4}body.mon .rw .x b{font-size:5vh;margin-left:1vw}
body.mon .rw .o{order:5;gap:.8vw}body.mon .rw .o u{width:1.6vw;height:3.4vh;border-radius:.6vh}
body.mon .sp{grid-column:1/-1;background:transparent;border:0;padding:0 1vw;gap:1.2vw}
body.mon .sp small{font-size:2.6vh}body.mon .sp img{height:8vh}
/* result at the end of a match */
#fin{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(1100px,92vw);background:#0B192C;color:#fff;border:4px solid #FFD700;border-radius:26px;padding:26px 30px;box-shadow:0 20px 60px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:16px;text-align:center;z-index:5}
#fin .t{font-weight:900;font-size:26px;letter-spacing:.2em;color:#B9C4D6}
#fin .w{font-weight:900;font-size:52px;line-height:1.3;color:#0B192C;background:#FFD700;border-radius:16px;padding:8px 16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fin table{width:100%;border-collapse:collapse}
#fin th{font-size:20px;font-weight:900;color:#B9C4D6;padding:6px}
#fin td{font:400 64px/1.05 VLNum,system-ui,sans-serif;padding:12px 6px;border-top:3px solid #1D3557}
#fin td:first-child{font:900 38px/1.3 "Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px}
#fin tr.win td{color:#FFD700}
#fin .y{font-weight:800;font-size:20px;color:#B9C4D6}
body.mon #fin{width:94vw;border-width:.8vh;border-radius:4vh;padding:4vh 3vw;gap:2.6vh}
body.mon #fin .t{font-size:4vh}body.mon #fin .w{font-size:8.5vh;border-radius:2.4vh;padding:1.4vh 2vw}
body.mon #fin th{font-size:3.2vh}body.mon #fin td{font-size:12vh;padding:2vh 1vw}body.mon #fin td:first-child{font-size:6.4vh;max-width:40vw}body.mon #fin .y{font-size:3vh}
/* standings / bracket shown over the whole picture between games */
#bd{position:fixed;inset:0;width:100vw;height:100vh;border:0;z-index:8;background:#0B192C}
/* sponsor commercials played over the whole picture between games, taking turns with the board */
#cmv{position:fixed;inset:0;width:100vw;height:100vh;z-index:9;background:#000;object-fit:contain}
#msg{position:fixed;left:40px;top:40px;background:#0B192C;color:#fff;font-weight:800;font-size:22px;line-height:1.7;padding:16px 20px;border-radius:14px;max-width:900px}
.ck{position:relative}.ck b{font:inherit}
.ck .queen-meter{position:absolute;left:8%;bottom:5px;width:84%;height:5px}
body.queen .hd{background:#171A22}
body.queen #tt{display:inline-block;background:#C0FC09;color:#171A22;border-radius:6px;padding:6px 10px;font-size:21px;letter-spacing:.02em}
body.queen .hd .tw{gap:5px}
body.queen .queen-badges{font-size:14px;letter-spacing:0}
body.queen.bar #card{height:112px}
body.queen.bar .hd{max-width:520px;padding:8px 14px}
body.queen.bar .in{padding:0 14px;gap:8px}
body.queen.bar .rw{gap:7px;padding-right:12px}
body.queen.bar .rw .n{font-size:26px}
body.queen .rw .o{align-items:center;font-weight:900;font-size:13px}
body.queen .rw .o::before{content:'EXT';margin-right:3px}
body.queen.mon .hd .tw{flex-direction:column;align-items:flex-start}
body.queen.mon #tt{font-size:3.5vh}
body.queen.mon .queen-badges{font-size:1.8vh}
body.queen.mon .rw .o{font-size:2.4vh}
</style>
</head>
<body>
<div id="card" hidden>
  <div class="hd"><span class="tw"><span id="tt">Pre Queen Cup 2026-2027</span><small id="ts" hidden></small><span class="queen-badges" id="queenBadges" hidden><span id="queenFinal" hidden>FINAL INNING<small>最終イニング</small></span><span id="queenEqual" hidden>EQUALIZING INNING<small>後攻ラストチャンス</small></span></span></span><span id="rd" hidden></span></div>
  <div class="in"><small id="inl">INN</small><span class="ic"><span class="iv"><b id="inn">1</b><span id="of" hidden></span></span><em id="lim" hidden></em></span></div>
  <div class="ck" id="ck"><b id="ckNumber"></b><span class="queen-meter" id="queenMeter" hidden><i id="queenGauge"></i></span></div>
  <div class="rw a" id="rA"><i></i><span class="n"><span class="d"></span><span id="nA">PLAYER A</span></span><span class="h" id="hA"></span><span class="o" id="oA"></span><span class="x" id="xwA">HR<b id="xA">0</b></span><span class="s" id="sA">0</span></div>
  <div class="rw b" id="rB"><i></i><span class="n"><span class="d"></span><span id="nB">PLAYER B</span></span><span class="h" id="hB"></span><span class="o" id="oB"></span><span class="x" id="xwB">HR<b id="xB">0</b></span><span class="s" id="sB">0</span></div>
  <div class="sp" id="sp" hidden><small>協賛</small></div>
</div>
<div id="fin" hidden><div class="t">試合終了</div><div class="w" id="fw"></div><table id="ft"></table><div class="y" id="fy"></div></div>
<iframe id="bd" title="リーグ表・トーナメント表" hidden></iframe>
<video id="cmv" playsinline preload="none" hidden></video>
<div id="msg" hidden></div>
<script src="/js/queen-cup.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); }, q = location.search;
  var QC = window.VibesQueenCup, queen = false, clockLength = 0;
  var WSH = /\.workers\.dev$/.test(location.host) ? location.host : 'vibes-site1.quiet-darkness-2185.workers.dev';
  function clean(m) { return String(m || '').toLowerCase().replace(/[^a-z0-9_-]/g, '').slice(0, 40); }
  function room(m) { var h = 2166136261; for (var i = 0; i < m.length; i++) { h ^= m.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return String(100000 + (h % 900000)); }
  var mm = /[?&]match=([^&#]+)/.exec(q), match = clean(mm ? decodeURIComponent(mm[1]) : '');
  var sc = Math.max(0.5, Math.min(3, parseFloat((/[?&]scale=([0-9.]+)/.exec(q) || [])[1]) || 1)), pos = (/[?&]pos=(tr|bl|br)/.exec(q) || [])[1] || 'tl', c = $('card');
  var lay = (/[?&]layout=(card|monitor)/.exec(q) || [])[1] || 'bar', showRes = !/[?&]result=0/.test(q);
  if (/[?&]bg=1/.test(q)) document.body.classList.add('bg');
  if (lay === 'monitor') document.body.classList.add('mon');
  else if (lay === 'bar') { c.style.transform = 'scale(' + sc + ')'; document.body.classList.add('bar'); c.style.width = (100 / sc) + 'vw'; if (pos === 'bl' || pos === 'br') { c.style.top = 'auto'; c.style.bottom = '0'; c.style.transformOrigin = '0 100%'; } }
  else {
    c.style.transform = 'scale(' + sc + ')';
    if (pos === 'tr' || pos === 'br') { c.style.left = 'auto'; c.style.right = '40px'; c.style.transformOrigin = '100% ' + (pos === 'br' ? '100%' : '0'); }
    if (pos === 'bl' || pos === 'br') { c.style.top = 'auto'; c.style.bottom = '40px'; if (pos === 'bl') c.style.transformOrigin = '0 100%'; }
  }
  /* sponsors' logos shown with the score, per event (the match id may carry a suffix such as w3c-1205-t2). Files are the ones the organiser supplied. */
  var SPONSORS = { 'w3c-1205': [['/img/event/w3c-1205/sp-3seconds.jpg', '3seconds'], ['/img/event/w3c-1205/sp-labeaute.png', 'La Beaute']] };
  Object.keys(SPONSORS).forEach(function (k) { if (match === k || match.indexOf(k + '-') === 0) { SPONSORS[k].forEach(function (s) { var i = new Image(); i.src = s[0]; i.alt = s[1]; $('sp').appendChild(i); }); $('sp').hidden = /[?&]sponsor=0/.test(q); } });
  /* Between games the stream shows the organiser's tables (event-board): the result panel first, then the standings or the bracket,
     until the next game starts at this table. &board=0 turns this off, &boardwait=<seconds> sets how long the result stays (default 10).
     The board page says when it has something to show; without that (no draw made yet) nothing covers the picture. */
  var BOARD = !/[?&]board=0/.test(q) && lay !== 'monitor', BWAIT = Math.max(0, Math.min(120, parseFloat((/[?&]boardwait=([0-9.]+)/.exec(q) || [])[1]))), bdReady = false, bdTimer = null, bdOn = false, bdDue = false;
  if (isNaN(BWAIT)) BWAIT = 10;
  if (BOARD && match) { $('bd').src = '/event-board/?match=' + encodeURIComponent(match.replace(/-t\d+$/, '')); window.addEventListener('message', function (e) { if (e.data && e.data.vibesBoard) { bdReady = true; if (bdOn && bdDue) $('bd').hidden = false; } }); }
  /* Sponsor commercials (2026-11-21). Between games: result -> board for CMWAIT seconds -> one commercial -> board -> the next sponsor's commercial ... until the next game starts.
     Since 2026-11-25 the break is: board -> ALL films joined in a random order -> board -> all films again in a new order ... The list is /cm/list.json ([{name, sponsor, src}]). &cm=0 turns it off, &cmwait=<seconds> sets the board time (default 20). */
  var CM = !/[?&]cm=0/.test(q) && lay !== 'monitor', CMWAIT = Math.max(5, Math.min(600, parseFloat((/[?&]cmwait=([0-9.]+)/.exec(q) || [])[1]))), cmList = [], cmTimer = null, cmGuard = null;
  if (isNaN(CMWAIT)) CMWAIT = 20;
  if (CM && window.fetch) fetch('/cm/list.json', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : []; }).then(function (l) { cmList = (Array.isArray(l) ? l : []).filter(function (x) { return x && typeof x.src === 'string' && /^\/cm\/[\w.\-]+\.mp4$/.test(x.src); }); }).catch(function () {});
  /* Random order, joined (2026-11-25): at each break ALL films play one after another, in a new random order every time, and two films of the same sponsor never touch (also not across two breaks) as long as the list allows it.
     &cmrun=<n> plays only n films per break (1 = one film, then the board again). st = {q: the films still to come in this round, s: the sponsor shown last}; kept in this browser. */
  var CMRKEY = 'vibes-cm-r', CMRUN = parseInt((/[?&]cmrun=(\d+)/.exec(q) || [])[1], 10) || 0, cmLeft = 0;
  function cmOrder(list, last, rnd) {
    var sp = function (x) { return x.sponsor || x.name || x.src; }, best = null, bestBad = 1e9;
    for (var t = 0; t < 300 && bestBad > 0; t++) {
      var a = list.slice(), i, j, x, bad = 0;
      for (i = a.length - 1; i > 0; i--) { j = Math.floor(rnd() * (i + 1)); x = a[i]; a[i] = a[j]; a[j] = x; }
      if (last != null && sp(a[0]) === last) bad += 2;
      for (i = 1; i < a.length; i++) if (sp(a[i]) === sp(a[i - 1])) bad++;
      if (bad < bestBad) { bestBad = bad; best = a; }
    }
    return best.map(function (x) { return x.src; });
  }
  function cmPick(list, st, rnd) {
    var sp = function (x) { return x.sponsor || x.name || x.src; }, by = function (u) { for (var k = 0; k < list.length; k++) if (list[k].src === u) return k; return -1; };
    var qu = (st && Array.isArray(st.q) ? st.q : []).filter(function (u) { return by(u) >= 0; }), last = st ? st.s : null;
    if (!qu.length) qu = cmOrder(list, last, rnd);
    var i = by(qu.shift());
    return { i: i, st: { q: qu, s: sp(list[i]) } };
  }
  function cmStop() { clearTimeout(cmTimer); clearTimeout(cmGuard); var v = $('cmv'); if (!v.hidden) { try { v.pause(); } catch (e) {} v.hidden = true; v.removeAttribute('src'); try { v.load(); } catch (e) {} } }
  function cmQueue() { clearTimeout(cmTimer); if (!CM) return; cmLeft = 0; cmTimer = setTimeout(cmPlay, CMWAIT * 1000); }
  function cmPlay() {
    if (!bdOn || !cmList.length) { cmQueue(); return; }
    if (cmLeft <= 0) cmLeft = Math.min(CMRUN || cmList.length, 50);
    cmLeft--;
    var st = {}; try { st = JSON.parse(localStorage.getItem(CMRKEY)) || {}; } catch (e) {}
    var pk = cmPick(cmList, st, Math.random), i = pk.i; try { localStorage.setItem(CMRKEY, JSON.stringify(pk.st)); } catch (e) {}
    var v = $('cmv'), done = false, end = function () { if (done) return; done = true; clearTimeout(cmGuard); v.onended = v.onerror = null; try { v.pause(); } catch (e) {} if (bdOn && cmLeft > 0) { cmPlay(); return; } v.hidden = true; if (bdOn) cmQueue(); };
    v.onended = end; v.onerror = end; v.muted = false; v.src = cmList[i].src; v.hidden = false;
    var p = v.play(); if (p && p.catch) p.catch(function () { v.muted = true; var p2 = v.play(); if (p2 && p2.catch) p2.catch(end); });   /* a normal browser refuses sound without a click: play it silent there. OBS plays the sound */
    cmGuard = setTimeout(end, 120000);
  }
  function boardShow(on) { if (!BOARD) return; if (on === bdOn) return; bdOn = on; bdDue = false; clearTimeout(bdTimer); if (!on) { $('bd').hidden = true; cmStop(); return; } bdTimer = setTimeout(function () { bdDue = true; if (bdOn && bdReady) $('bd').hidden = false; cmQueue(); }, (showRes ? BWAIT : 3) * 1000); }
  var KEY = 'vibes-event-obs:' + match, ws = null, tries = 0, timer = null, last = 0, CK = null;
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function draw(m, live) {
    if (!m || m.type !== 'state' || !m.p || m.p.length !== 2 || (m.m && m.m !== match)) return;
    var g = m.cfg || {}, pk = g.mode === 'pocket', stats = g.stats !== false && !pk;
    queen = QC.active(g); clockLength = g.clk | 0;
    document.body.classList.toggle('queen', queen);
    var badges = QC.status(m);
    $('queenBadges').hidden = !queen;
    $('queenFinal').hidden = !badges.final;
    $('queenEqual').hidden = !badges.equalizing;
    $('queenMeter').hidden = !queen;
    var tp = String(m.title || 'Pre Queen Cup 2026-2027').split('｜'); $('tt').textContent = tp[0]; $('ts').textContent = tp[1] || ''; $('ts').hidden = !tp[1]; $('rd').textContent = m.round || ''; $('rd').hidden = !m.round;
    if (queen) $('tt').textContent = QC.title;
    $('inl').textContent = pk ? 'RACK' : 'INN'; $('inn').textContent = pk ? (m.p[0].s | 0) + (m.p[1].s | 0) + 1 : m.inn;
    /* inning as "12 / 35" when the match has a cap; the badge lights only for the moments that matter: the last inning, and the second player's reply after the first has reached the target */
    var lim = g.limit | 0, le = $('lim'), of = $('of'); of.hidden = !lim || pk || !!m.sd; of.textContent = '/ ' + lim;
    var p0 = m.p[0], up = !pk && g.back && p0.h > 0 && p0.s >= p0.h, st = m.over ? '' : m.sd ? 'サドンデス' : m.rep ? '裏撞き' : up && m.turn === 0 ? '裏撞きへ' : lim && !pk && m.inn >= lim ? '最終キュー' : '';
    le.hidden = !st; le.textContent = st;
    [['A', 0], ['B', 1]].forEach(function (x) {
      var p = m.p[x[1]]; $('n' + x[0]).textContent = p.n; $('s' + x[0]).textContent = p.s; $('h' + x[0]).textContent = p.h > 0 ? '(' + p.h + ')' : ''; $('x' + x[0]).textContent = p.hr | 0; $('xw' + x[0]).hidden = !stats;
      $('r' + x[0]).classList.toggle('on', m.turn === x[1] && !m.over);
      var o = '', n = g.clk ? g.to | 0 : 0;
      for (var k = 0; k < n; k++) {
        var used = queen ? !!(QC.usedMask(p) & (1 << k)) : k < (p.to | 0);
        o += '<u' + (used ? ' class="used"' : '') + '></u>';
      }
      $('o' + x[0]).innerHTML = o;
      $('o' + x[0]).setAttribute('aria-label', (queen ? 'EXT ' : 'タイムアウト ') + Math.max(0, n - (p.to | 0)) + '回残り');
    });
    c.classList.toggle('turn', !m.over);
    /* shot clock: counted here from the moment the message arrived, so the two devices' clocks need not agree */
    CK = g.clk && m.ck ? { left: +m.ck.left || 0, run: !!m.ck.run && live !== false, at: Date.now() } : g.clk ? { left: g.clk * 1000, run: false, at: Date.now() } : null; $('ck').classList.toggle('use', !!g.clk); c.classList.toggle('hasck', !!g.clk); tick();
    var f = $('fin'); f.hidden = !(m.over && showRes);
    if (m.over) {
      var w = m.over.w; $('fw').textContent = w === -2 ? '両者負け' : w < 0 ? '引き分け' : '勝者　' + m.p[w].n;
      $('ft').innerHTML = '<tr><th></th><th>' + (pk ? 'セット' : '得点') + '</th>' + (pk ? '' : '<th>イニング</th><th>アベレージ</th><th>ハイラン</th>') + '</tr>' + [0, 1].map(function (i) { var p = m.p[i]; return '<tr' + (w === i ? ' class="win"' : '') + '><td>' + esc(p.n) + '</td><td>' + (p.s | 0) + '</td>' + (pk ? '' : '<td>' + (p.in | 0) + '</td><td>' + esc(p.avg || '-') + '</td><td>' + (p.hr | 0) + '</td>') + '</tr>'; }).join('');
      $('fy').textContent = m.over.why === 'sd' ? 'サドンデスで決着' : m.over.why === 'limit' ? '打切り ' + lim + ' キュー' + (w === -2 ? '（どちらも試合点数に届かず）' : '') : '';
    }
    boardShow(!!m.over && live !== false);
    c.hidden = false; $('msg').hidden = true; try { localStorage.setItem(KEY, JSON.stringify(m)); } catch (e) {}
  }
  function tick() {
    var e = $('ck');
    if (!CK) { $('ckNumber').textContent = ''; document.body.classList.remove('clock-warning'); return; }
    var l = Math.max(0, CK.run ? CK.left - (Date.now() - CK.at) : CK.left);
    var warn = CK.run && (queen ? l < 10000 : l <= 10000);
    $('ckNumber').textContent = Math.ceil(l / 1000);
    $('queenGauge').style.width = (clockLength ? Math.min(100, l / (clockLength * 1000) * 100) : 0) + '%';
    e.classList.toggle('warn', warn); e.classList.toggle('stop', !CK.run);
    document.body.classList.toggle('clock-warning', queen && warn);
  }
  setInterval(tick, 200);
  function connect() {
    try { ws = new WebSocket('wss://' + WSH + '/api/count/' + room(match) + '?role=remote'); } catch (e) { return; }
    var ping; ws.onopen = function () { tries = 0; last = Date.now(); ping = setInterval(function () { if (ws.readyState === 1) ws.send('ping'); if (Date.now() - last > 70000) { try { ws.close(); } catch (e) {} } }, 25000); };
    ws.onmessage = function (ev) { last = Date.now(); if (ev.data === 'pong') return; var m; try { m = JSON.parse(ev.data); } catch (e) { return; } draw(m, true); };
    ws.onclose = function () { clearInterval(ping); clearTimeout(timer); timer = setTimeout(connect, Math.min(8000, 500 * Math.pow(2, tries++))); };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  }
  if (!match) { $('msg').hidden = false; $('msg').textContent = 'アドレスの最後に、試合IDを付けて開いてください。例：/event-score-obs?match=w3c-1205'; return; }
  /* the last score seen stays on screen through a reload or a short loss of connection (a running clock is shown stopped until the next message) */
  try { var j = JSON.parse(localStorage.getItem(KEY) || 'null'); if (j) draw(j, false); } catch (e) {}
  connect(); window.addEventListener('online', function () { if (!ws || ws.readyState > 1) { clearTimeout(timer); connect(); } });
})();
</script>
