<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ログイン｜VIBES BILLIARDS DIGITAL LABO</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/img/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+JP:wght@500;700;900&display=swap">
<style>
:root{--night:#171A22;--night2:#20242E;--line:#3A3F4C;--lime:#C0FC09;--chalk:#F3F4EF;--sub:#A9AFBD}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--night);color:var(--chalk);font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;font-weight:500;padding:24px max(18px,env(safe-area-inset-left))}
[hidden]{display:none!important}
.box{width:min(100%,440px);display:grid;gap:18px}
.box>a img{height:120px;width:auto;display:block;margin:0 auto}
.card{background:var(--night2);border-radius:18px;padding:24px;display:grid;gap:14px}
h1{font-size:24px;margin:0;font-weight:900}
p{margin:0;color:var(--sub);font-size:15px;line-height:1.7;font-weight:700}
label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
input{width:100%;font:inherit;font-size:19px;font-weight:700;color:var(--chalk);background:var(--night);border:2px solid var(--line);border-radius:12px;padding:12px}
input:focus{outline:none;border-color:var(--lime)}
button{font:inherit;font-weight:900;font-size:19px;color:var(--night);background:var(--lime);border:0;border-radius:14px;padding:14px;cursor:pointer;width:100%}
button:disabled{opacity:.6}
.err{color:#FF8A8F;min-height:22px}
.links{display:flex;justify-content:space-between;gap:12px;font-size:14px;font-weight:700}.links a{color:var(--sub)}
</style>
</head>
<body>
<div class="box">
  <a href="/" id="home" aria-label="VIBES BILLIARDS DIGITAL LABO"><img src="/img/vibes-digilabo-t.png" alt="VIBES DIGILABO" width="717" height="406"></a>
  <form class="card" id="f">
    <h1>導入店舗ログイン</h1>
    <p id="msg">お店のIDとパスワードを入れてください。</p>
    <div><label for="id">ID</label><input id="id" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
    <div><label for="pw">パスワード</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <p class="err" id="err" role="alert"></p>
    <button type="submit" id="go">ログイン</button>
  </form>
  <div class="links"><a href="/" id="back">トップへ戻る</a><a href="https://vibesbilliards.com/pages/contact">IDをお持ちでない方・パスワードを忘れた方</a></div>
</div>
<script>
(function () {
  var $ = function (i) { return document.getElementById(i); }, labo = /vibesdigilabo\.com$|^labo\.localhost$/.test(location.hostname), q = new URLSearchParams(location.search);
  if (!labo) { $('home').href = '/labo/'; $('back').href = '/labo/'; }
  var next = q.get('next') || '/pages/count/'; if (!/^\/pages\/count(-3c|-pocket)?\/?(\?[^#]*)?$/.test(next)) next = '/pages/count/';
  if (q.get('why') === 'expired') $('msg').textContent = '利用期間が終了しました。運営にお問い合わせください。'; else if (q.get('why') === 'stopped') $('msg').textContent = 'このアカウントは停止中です。運営にお問い合わせください。';
  fetch('/api/labo/me', { credentials: 'same-origin' }).then(function (r) { return r.json(); }).then(function (j) { if (j && j.ok) location.replace(next); }).catch(function () {});
  $('f').addEventListener('submit', function (e) { e.preventDefault(); $('err').textContent = ''; $('go').disabled = true;
    fetch('/api/labo/login', { method: 'POST', credentials: 'same-origin', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: $('id').value, pw: $('pw').value }) })
      .then(function (r) { return r.json().catch(function () { return { ok: false, error: 'このページからはログインできません。vibesdigilabo.com で開いてください。' }; }); })
      .then(function (j) { if (j.ok) location.replace(next); else { $('err').textContent = j.error || 'ログインできませんでした。'; $('go').disabled = false; } })
      .catch(function () { $('err').textContent = '通信できませんでした。ネットを確かめて、もう一度押してください。'; $('go').disabled = false; });
  });
})();
</script>
</body>
</html>
